<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ParkNous</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preload" as="image" href="./template_UI_parknous.png?v=40" />
  <link rel="preload" as="image" href="./favicon.png" />
  <meta name="theme-color" content="#02070d" />
  <style>

    :root {
      --bg: #02070d;
      --text: #ffffff;
      --muted: rgba(232, 238, 255, 0.72);
      --cyan: #33e7f2;
      --gold: #ffd166;
      --teal: #28d2ad;
      --red: #ff6b72;
      --glass: rgba(3, 10, 17, 0.55);
      --line: rgba(51, 231, 242, 0.24);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #090d15;
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 5px;
    }

    button {
      appearance: none;
      border: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.50;
      cursor: not-allowed;
    }

    .app {
      position: relative;
      width: min(100%, 430px);
      height: calc(100svh - 10px);
      max-height: 860px;
      min-height: 640px;
      overflow: hidden;
      border-radius: 32px;
      background: #02070d;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(51, 231, 242, 0.12);
    }

    .top {
      display: none;
    }

    .content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .template-board {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
      background: #02070d;
      isolation: isolate;
    }

    .template-bg-img {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      opacity: 1;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      background: #02070d;
    }

    .image-fallback {
      display: grid;
      position: absolute;
      inset: 0;
      z-index: 0;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: #ff9ca2;
      font-weight: 900;
      background:
        radial-gradient(circle at 50% 30%, rgba(51, 231, 242, 0.10), transparent 30%),
        #02070d;
    }

    html.template-image-failed .image-fallback {
      z-index: 5;
    }

    html.template-image-loaded .image-fallback {
      display: none;
    }

    .pill-row {
      display: none;
    }

    /* clickable current controls */
    .live-actions {
      position: absolute;
      inset: 0;
      z-index: 40;
      pointer-events: none;
    }

    .cockpit-btn,
    .cockpit-delete {
      position: absolute;
      pointer-events: auto;
      margin: 0;
      padding: 0;
      color: transparent;
      background: rgba(51, 231, 242, 0.001);
      border: 1px solid transparent;
      box-shadow: none;
      overflow: hidden;
      touch-action: manipulation;
    }

    .cockpit-btn:active,
    .cockpit-delete:active {
      background: rgba(51, 231, 242, 0.17);
      border-color: rgba(51, 231, 242, 0.35);
    }

    .cockpit-btn .btn-icon,
    .cockpit-btn .btn-copy,
    .cockpit-delete .btn-icon,
    .cockpit-delete .btn-copy {
      opacity: 0;
      pointer-events: none;
    }

    html.template-mode .cockpit-btn,
    html.template-mode .cockpit-delete {
      background: rgba(51, 231, 242, 0.14);
      border-color: rgba(255, 209, 102, 0.70);
    }

    html.template-mode .cockpit-btn .btn-icon,
    html.template-mode .cockpit-btn .btn-copy,
    html.template-mode .cockpit-delete .btn-icon,
    html.template-mode .cockpit-delete .btn-copy {
      opacity: 0.75;
      color: #fff;
      display: grid;
      place-items: center;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.85);
    }

    .btn-title {
      font-size: 0.68rem;
      font-weight: 1000;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .btn-subtitle {
      font-size: 0.48rem;
      color: rgba(232,238,255,0.75);
      font-weight: 800;
    }

    .cockpit-show {
      left: 6.5%;
      top: 17.0%;
      width: 34.0%;
      height: 17.0%;
      border-radius: 48px 30px 34px 58px;
    }

    .cockpit-navigate {
      right: 6.5%;
      top: 17.0%;
      width: 34.0%;
      height: 17.0%;
      border-radius: 30px 48px 58px 34px;
    }

    .cockpit-save {
      left: 6.4%;
      top: 46.2%;
      width: 34.0%;
      height: 16.8%;
      border-radius: 58px 34px 30px 48px;
    }

    .cockpit-share {
      right: 6.4%;
      top: 46.2%;
      width: 34.0%;
      height: 16.8%;
      border-radius: 34px 58px 48px 30px;
    }

    .cockpit-delete {
      left: 50%;
      top: 58.4%;
      width: 17%;
      height: 8.8%;
      min-height: 0;
      transform: translateX(-50%);
      border-radius: 999px;
    }

    .cockpit-delete:active {
      transform: translateX(-50%) scale(0.95);
    }

    /* live current spot text overlay */
    .hero {
      position: absolute;
      z-index: 25;
      left: 50%;
      top: 31.4%;
      width: 42%;
      height: 19.8%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2px;
      padding: 7px 10px;
      text-align: center;
      border: 0;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.08);
      pointer-events: none;
      overflow: hidden;
    }

    .hero::before {
      display: none;
    }

    .hero-icon-wrap {
      position: relative;
      width: 28px;
      height: 28px;
      margin: 0 0 2px;
      flex: 0 0 auto;
      opacity: 0.88;
    }

    .hero-icon {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(51, 231, 242, 0.08);
    }

    .brand-logo {
      width: 25px;
      height: 25px;
      object-fit: contain;
      display: block;
    }

    .radar-ring,
    .radar-ring-2 {
      display: none;
    }

    .hero-title {
      max-width: 136px;
      max-height: 2.25em;
      margin: 0;
      font-size: clamp(0.78rem, 4vw, 1.05rem);
      line-height: 1.10;
      font-weight: 1000;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .hero-text {
      max-width: 136px;
      max-height: 2.18em;
      min-height: 0;
      padding: 0;
      font-size: 0.53rem;
      line-height: 1.09;
      color: rgba(218,250,255,0.84);
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .hero-meta {
      max-width: 136px;
      max-height: 1.14em;
      min-height: 0;
      margin: 1px 0 0;
      font-size: 0.44rem;
      line-height: 1.08;
      color: rgba(232,238,255,0.68);
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-row {
      display: none;
    }

    .action-row.show {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 4px;
      z-index: 80;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      pointer-events: auto;
    }

    .mini-btn {
      min-height: 34px;
      border-radius: 12px;
      color: white;
      font-size: 0.72rem;
      font-weight: 900;
      background: linear-gradient(180deg, #4ea6ff, #297ae7);
    }

    .mini-btn.cancel {
      background: linear-gradient(180deg, #6f737c, #4f545d);
    }

    /* bottom real/dynamic panels */
    .spot-panels {
      position: absolute;
      z-index: 30;
      left: 5.7%;
      right: 5.7%;
      top: 68.0%;
      bottom: 4.3%;
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 0;
      overflow: hidden;
      border-radius: 22px;
      background: rgba(3, 10, 17, 0.18);
    }

    .spot-panel {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-rows: 43px minmax(0,1fr);
      padding: 7px 6px 8px;
      overflow: hidden;
      background: transparent;
    }

    .spot-panel + .spot-panel {
      border-left: 1px solid rgba(255,255,255,0.23);
    }

    .panel-head {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: start;
      gap: 4px;
      margin: 0;
      min-width: 0;
    }

    .panel-title {
      max-width: 100%;
      font-size: clamp(0.52rem, 2.8vw, 0.66rem);
      line-height: 1.03;
      font-weight: 1000;
      text-transform: uppercase;
      color: #eaffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .panel-note {
      max-width: 100%;
      font-size: 0.39rem;
      line-height: 1.06;
      color: rgba(232,238,255,0.72);
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .panel-head-right {
      display: flex;
      align-items: center;
      gap: 3px;
      min-width: 0;
    }

    .panel-head-right .panel-note {
      max-width: 34px;
      color: #62f7ff;
      font-weight: 950;
      text-align: right;
    }

    .panel-toggle {
      width: 30px;
      height: 30px;
      min-width: 30px;
      border-radius: 13px;
      background: rgba(3, 14, 22, 0.35);
      border: 1px solid rgba(51,231,242,0.25);
      position: relative;
      box-shadow: 0 0 12px rgba(51,231,242,0.09);
    }

    .panel-toggle::before {
      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      border: solid rgba(255,255,255,0.95);
      border-width: 0 4px 4px 0;
      left: 50%;
      top: 43%;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .carousel-shell {
      min-height: 0;
      height: 100%;
      overflow: hidden;
      border-radius: 13px;
    }

    .spot-list {
      height: 100%;
      display: flex;
      gap: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      touch-action: pan-x;
    }

    .spot-list::-webkit-scrollbar {
      display: none;
    }

    .spot-item {
      flex: 0 0 100%;
      min-width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0,1fr) auto;
      gap: 4px;
      padding: 6px;
      overflow: hidden;
      border-radius: 13px;
      background: rgba(2,9,16,0.56);
      border: 1px solid rgba(51,231,242,0.13);
      backdrop-filter: blur(2px);
      scroll-snap-align: start;
    }

    .spot-row-main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 4px;
      align-items: start;
      overflow: hidden;
    }

    .spot-row-main > div:first-child {
      min-width: 0;
      overflow: hidden;
    }

    .spot-name {
      max-width: 100%;
      max-height: 2.18em;
      font-size: clamp(0.52rem, 2.75vw, 0.66rem);
      line-height: 1.09;
      font-weight: 1000;
      color: white;
      text-shadow: 0 2px 7px rgba(0,0,0,0.9);
      white-space: normal;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    .spot-meta-small {
      margin-top: 3px;
      max-width: 100%;
      color: rgba(232,238,255,0.68);
      font-size: 0.36rem;
      line-height: 1.08;
      text-shadow: 0 2px 7px rgba(0,0,0,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spot-badge {
      min-width: 30px;
      max-width: 34px;
      padding: 4px 4px;
      border-radius: 999px;
      color: #75f9ff;
      font-size: 0.39rem;
      line-height: 1;
      font-weight: 1000;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid rgba(51,231,242,0.34);
      background: rgba(51,231,242,0.10);
    }

    .spot-actions {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .spot-actions.three-actions {
      grid-template-columns: repeat(3, minmax(0,1fr));
    }

    .spot-actions.four-actions {
      grid-template-columns: repeat(2, minmax(0,1fr));
    }

    .tiny-btn {
      min-width: 0;
      min-height: 21px;
      padding: 3px 2px;
      border-radius: 8px;
      color: white;
      font-size: 0.32rem;
      line-height: 1;
      font-weight: 950;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: linear-gradient(180deg, rgba(58,66,82,0.72), rgba(24,31,43,0.72));
      border: 1px solid rgba(255,255,255,0.08);
    }

    .tiny-btn.delete-small {
      color: #ffd4d7;
      border-color: rgba(255,107,114,0.40);
      background: rgba(255,107,114,0.18);
    }

    .empty-note {
      color: var(--muted);
      font-size: 0.62rem;
      padding: 8px;
    }

    /* modal list */
    .list-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: transparent;
    }

    .list-backdrop[hidden] {
      display: none;
    }

    .spot-dropdown {
      display: none;
    }

    .spot-list-modal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: transparent;
      pointer-events: auto;
    }

    .spot-list-modal[hidden] {
      display: none;
    }

    .spot-list-modal-sheet {
      position: fixed;
      left: 50%;
      top: 72px;
      width: min(calc(100vw - 28px), 410px);
      max-height: calc(100svh - 88px);
      transform: translateX(-50%);
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid rgba(51, 231, 242, 0.28);
      border-radius: 20px;
      background: rgba(7, 14, 22, 0.985);
      box-shadow: 0 22px 58px rgba(0,0,0,0.62);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .spot-list-modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 2px 2px 6px;
    }

    .spot-list-modal-title {
      font-size: 0.88rem;
      font-weight: 950;
      color: #e5fbff;
    }

    .spot-list-modal-close {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 1px solid rgba(51, 231, 242, 0.22);
      background: rgba(51, 231, 242, 0.10);
      color: #fff;
      font-size: 1rem;
      font-weight: 950;
    }

    .spot-list-modal-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 54px 54px;
      gap: 7px;
      padding: 8px;
      border-radius: 15px;
      border: 1px solid rgba(51, 231, 242, 0.13);
      background: rgba(51, 231, 242, 0.055);
    }

    .spot-list-modal-row.recent-actions {
      grid-template-columns: minmax(0, 1fr) 54px 54px 54px;
    }

    .spot-list-modal-row.selected {
      outline: 1px solid rgba(51, 231, 242, 0.58);
      background: rgba(51, 231, 242, 0.13);
    }

    .spot-list-modal-preview {
      min-width: 0;
      min-height: 48px;
      padding: 8px 9px;
      border: 1px solid rgba(51, 231, 242, 0.13);
      border-radius: 13px;
      background: rgba(255,255,255,0.045);
      color: inherit;
      text-align: left;
      overflow: hidden;
    }

    .spot-list-modal-name,
    .spot-list-modal-meta {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spot-list-modal-name {
      font-size: 0.74rem;
      font-weight: 900;
      color: #ffffff;
    }

    .spot-list-modal-meta {
      margin-top: 2px;
      font-size: 0.60rem;
      color: rgba(218, 250, 255, 0.72);
    }

    .spot-list-modal-btn {
      width: 54px;
      min-height: 48px;
      padding: 0 4px;
      font-size: 0.56rem;
      border-radius: 13px;
      border: 1px solid rgba(51, 231, 242, 0.18);
      background: linear-gradient(180deg, rgba(45, 101, 122, 0.95), rgba(28, 52, 70, 0.95));
      color: #fff;
      font-weight: 950;
    }

    .spot-list-modal-btn.save {
      background: linear-gradient(180deg, rgba(52, 211, 170, 0.95), rgba(17, 132, 111, 0.95));
    }

    .spot-list-modal-btn.delete {
      border-color: rgba(255, 117, 125, 0.45);
      background: rgba(255, 117, 125, 0.18);
      color: #ffd4d7;
    }

    .spot-list-modal-empty {
      padding: 12px;
      border-radius: 14px;
      color: rgba(218, 250, 255, 0.72);
      background: rgba(51, 231, 242, 0.06);
    }

    .confirm-banner {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 12000;
      width: min(calc(100vw - 24px), 410px);
      transform: translateX(-50%) translateY(160%);
      opacity: 0;
      pointer-events: none;
      padding: 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 117, 125, 0.32);
      background: rgba(12, 14, 22, 0.98);
      box-shadow: 0 22px 58px rgba(0,0,0,0.62);
      transition: transform .22s ease, opacity .22s ease;
    }

    .confirm-banner.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .confirm-title {
      font-weight: 1000;
      margin-bottom: 4px;
    }

    .confirm-text {
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 10px;
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .confirm-btn {
      min-height: 42px;
      border-radius: 14px;
      background: #333b4a;
      color: white;
      font-weight: 900;
    }

    .confirm-btn.yes {
      background: #e25656;
    }

    .debug-panel {
      display: none;
    }

    html.template-mode::after {
      content: "v40 clean template";
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 20000;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(255,209,102,0.94);
      color: #061015;
      font-size: 0.58rem;
      font-weight: 1000;
    }

    @media (max-width: 390px) {
      .hero {
        width: 40%;
        height: 18.5%;
        top: 31.8%;
      }

      .hero-icon-wrap,
      .hero-icon {
        width: 24px;
        height: 24px;
      }

      .brand-logo {
        width: 21px;
        height: 21px;
      }

      .hero-title {
        font-size: 0.76rem;
      }

      .hero-text {
        font-size: 0.46rem;
      }

      .hero-meta {
        font-size: 0.38rem;
      }

      .panel-title {
        font-size: 0.50rem;
      }

      .panel-note {
        font-size: 0.35rem;
      }

      .panel-toggle {
        width: 27px;
        height: 27px;
        min-width: 27px;
      }

      .spot-panel {
        grid-template-rows: 40px minmax(0,1fr);
        padding: 6px 5px 7px;
      }

      .spot-item {
        padding: 5px;
      }

      .spot-name {
        font-size: 0.50rem;
      }

      .spot-meta-small {
        font-size: 0.32rem;
      }

      .tiny-btn {
        min-height: 19px;
        font-size: 0.29rem;
      }
    }

    (async () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get("reset") === "1") {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
        } catch (error) {
          console.warn("ParkNous reset failed", error);
        }
        params.delete("reset");
        params.set("v", "40-reset");
        window.location.replace(`${window.location.pathname}?${params.toString()}`);
      }

      if (params.get("template") === "1") {
        document.documentElement.classList.add("template-mode");
      }
    })();
  </script>

    function sanitizeProfileId(value) {
      if (typeof value !== "string") return "";
      const trimmed = value.trim();
      return /^[a-zA-Z0-9_-]{18,96}$/.test(trimmed) ? trimmed : "";
    }

    function getCookieValue(name) {
      const target = `${encodeURIComponent(name)}=`;
      const parts = document.cookie ? document.cookie.split(";") : [];

      for (const part of parts) {
        const trimmed = part.trim();
        if (trimmed.startsWith(target)) {
          return decodeURIComponent(trimmed.slice(target.length));
        }
      }

      return "";
    }

    function writeProfileCookie(profileId) {
      const secure = window.location.protocol === "https:" ? "; Secure" : "";
      document.cookie = `${encodeURIComponent(PROFILE_COOKIE_NAME)}=${encodeURIComponent(profileId)}; Max-Age=${PROFILE_ID_MAX_AGE_SECONDS}; Path=/; SameSite=Lax${secure}`;
    }

    function writeProfileLocal(profileId) {
      try {
        localStorage.setItem(PROFILE_ID_KEY, profileId);

      }

    function createGuestProfileId() {
      const bytes = new Uint8Array(18);

      if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(bytes);
      } else {
        for (let index = 0; index < bytes.length; index += 1) {
          bytes[index] = Math.floor(Math.random() * 256);
        }
      }

      return `pk_${Array.from(bytes)
        .map((byte) => byte.toString(36).padStart(2, "0"))
        .join("")}`;
    }

      const fromUrl = sanitizeProfileId(params.get("profile") || params.get("p") || "");

      try {

      } catch (error) {
        fromLocal = "";
      }

      const profileId = fromUrl || fromCookie || fromLocal || createGuestProfileId();

      writeProfileCookie(profileId);
      writeProfileLocal(profileId);

      return profileId;

    function namedSpotKey(spot) {
      const name = (spot?.name || "").trim().toLowerCase();
      if (name) return `name:${name}`;
      if (spot?.id) return `id:${spot.id}`;

      const lat = typeof spot?.lat === "number" ? spot.lat.toFixed(6) : "lat";
      const lng = typeof spot?.lng === "number" ? spot.lng.toFixed(6) : "lng";
      return `geo:${lat}:${lng}`;
    }

    function recentSpotKey(spot) {
      if (spot?.id) return `id:${spot.id}`;

      const lat = typeof spot?.lat === "number" ? spot.lat.toFixed(6) : "lat";
      const lng = typeof spot?.lng === "number" ? spot.lng.toFixed(6) : "lng";
      const timeBucket = Math.round(Number(spot?.savedAtMillis || 0) / 1000);
      return `geo:${lat}:${lng}:${timeBucket}`;
    }

    function mergeSpotArrays(localItems, cloudItems, { type = "recent", limit = 10 } = {}) {
      const keyFn = type === "named" ? namedSpotKey : recentSpotKey;
      const merged = new Map();

      [...(cloudItems || []), ...(localItems || [])]
        .map(normalizeSpot)
        .filter((spot) => typeof spot.lat === "number" && typeof spot.lng === "number")
        .forEach((spot) => {
          const key = keyFn(spot);
          const existing = merged.get(key);

          if (!existing || spotSortValue(spot) >= spotSortValue(existing)) {
            merged.set(key, { ...existing, ...spot });
          }
        });

      return Array.from(merged.values())
        .sort((a, b) => spotSortValue(b) - spotSortValue(a))
        .slice(0, limit);
    }

    function mergeRecentSpots(localItems, cloudItems) {
      return mergeSpotArrays(localItems, cloudItems, {
        type: "recent",
        limit: MAX_RECENT_SPOTS
      });
    }

    function mergeNamedLocations(localItems, cloudItems) {
      return mergeSpotArrays(localItems, cloudItems, {
        type: "named",
        limit: MAX_NAMED_LOCATIONS
      });
    }


    function addRecentSpot(spot) {
      const normalized = normalizeSpot(spot);
      const recent = readRecentSpots()
        .filter((item) => item.id !== normalized.id)
        .filter((item) => !(Math.abs((item.savedAtMillis || 0) - normalized.savedAtMillis) < 1000));

      const next = [normalized, ...recent].slice(0, MAX_RECENT_SPOTS);
      writeRecentSpots(next);
      renderSpotLists();
      return next;
    }

    async function handleSpotListModalClick(event) {
      if (!spotListModalEl || spotListModalEl.hidden) return;

      if (event.target === spotListModalEl) {
        event.preventDefault();
        event.stopPropagation();
        ignoreUnderlyingClickUntil = Date.now() + 800;
        closeAllDropdowns();
        return;
      }

      const button = event.target.closest("button[data-modal-action]");
      if (!button) return;

      event.preventDefault();
      event.stopPropagation();

      const action = button.dataset.modalAction;

      if (action === "close") {
        closeAllDropdowns();
        return;
      }

      const listName = button.dataset.list;
      const index = button.dataset.index;

      if (!listName || index === undefined) return;

      if (action === "preview") {
        selectPanelIndex(listName, index);
        return;
      }

      const spot = getSpotFromList(listName, index);
      if (!spot) return;

      if (action === "show") {
        openSpotOnMap(spot, false);
        return;
      }

      if (action === "navigate") {
        openSpotOnMap(spot, true);
        return;
      }

      if (action === "save-name") {
        await saveSpotWithName(spot);
        closeAllDropdowns();
        return;
      }

      if (action === "delete") {
        await deleteSpotFromList(listName, index);
        closeAllDropdowns();
      }
    }

    function enableCarouselSwipe(trackEl, listName) {
      if (!trackEl) return;

      let startX = 0;
      let startY = 0;
      let startedOnButton = false;
      let pointerActive = false;

      function recordStart(clientX, clientY, target) {
        startX = clientX;
        startY = clientY;
        startedOnButton = Boolean(target?.closest?.("button"));
      }

      function maybeSwipe(clientX, clientY) {
        if (startedOnButton || anyDropdownOpen()) return;

        const dx = clientX - startX;
        const dy = clientY - startY;

        if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy) + 8) {
          changePanelIndex(listName, dx < 0 ? 1 : -1);
        }
      }

      if (window.PointerEvent) {
        trackEl.addEventListener("pointerdown", (event) => {
          if (!event.isPrimary) return;
          pointerActive = true;
          recordStart(event.clientX, event.clientY, event.target);
        }, { passive: true });

        trackEl.addEventListener("pointerup", (event) => {
          if (!event.isPrimary || !pointerActive) return;
          pointerActive = false;
          maybeSwipe(event.clientX, event.clientY);
        }, { passive: true });

        trackEl.addEventListener("pointercancel", () => {
          pointerActive = false;
        }, { passive: true });
      }

      trackEl.addEventListener("touchstart", (event) => {
        const touch = event.changedTouches[0];
        if (!touch) return;
        recordStart(touch.clientX, touch.clientY, event.target);
      }, { passive: true });

      trackEl.addEventListener("touchend", (event) => {
        const touch = event.changedTouches[0];
        if (!touch) return;
        maybeSwipe(touch.clientX, touch.clientY);
      }, { passive: true });
    }

    async function copyTextToClipboard(textToCopy) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(textToCopy);
        return true;
      }

      const textarea = document.createElement("textarea");
      textarea.value = textToCopy;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();

      try {
        document.execCommand("copy");
        return true;
      } finally {
        document.body.removeChild(textarea);
      }
    }

    async function shareSpot(spot) {
      if (!spot) return;

      const url = buildSpotShareUrl(spot);
      const text = buildSpotShareText(spot);
      const title = "ParkNous";

      try {
        if (navigator.share) {
          await navigator.share({ title, text, url });
          return;
        }

        await copyTextToClipboard(`${text}\n${url}`);
        setHeroState("saved", "Share link copied", text, "Paste it anywhere you want.");
      } catch (error) {
        if (error?.name === "AbortError") return;

        console.warn("Share failed.", error);

        try {
          await copyTextToClipboard(`${text}\n${url}`);
          setHeroState("saved", "Share link copied", text, "Paste it anywhere you want.");
        } catch (copyError) {
          window.prompt("Copy this ParkNous link:", `${text}\n${url}`);
        }
      }
    }

      const ok = await showConfirmBanner({
        title: isSavedSpot ? "Delete saved spot?" : "Delete recent spot?",
        text: isSavedSpot
          ? `This will remove "${spot.name || "this saved spot"}" from your saved spots.`
          : "This will remove this spot from recent spots.",
        confirmLabel: "Delete",
        cancelLabel: "Keep it"
      });

      if (!ok) return;

      if (isSavedSpot) {
        const named = readNamedLocations().filter((_, itemIndex) => itemIndex !== numericIndex);
        if (savedPanelIndex >= named.length) savedPanelIndex = Math.max(0, named.length - 1);
        writeNamedLocations(named);
      } else {
        const recent = readRecentSpots().filter((_, itemIndex) => itemIndex !== numericIndex);
        if (recentPanelIndex >= recent.length) recentPanelIndex = Math.max(0, recent.length - 1);
        writeRecentSpots(recent);
      }

      renderSpotLists();
      syncAllParkingDataToCloud(lastKnownSpot || readLocalBackup(), {
        cloudFailureTitle: "Saved locally"
      });
    }

    async function saveSpotWithName(spot) {
      if (!spot) {
        setHeroState("error", "No location to save", "Save a parking spot first.");
        return false;
      }

      const defaultName = `Parking ${new Date(spot.savedAtMillis || Date.now()).toLocaleDateString("en-GB")}`;
      const rawName = window.prompt("Name this spot:", spot.name || defaultName);
      if (rawName === null) return false;

      const name = rawName.trim();
      if (!name) {
        setHeroState("error", "Name is empty", "Please give the saved spot a name.");
        return false;
      }

      let named = readNamedLocations();
      const sameName = named.find((item) => (item.name || "").toLowerCase() === name.toLowerCase());
      const sameId = spot.id ? named.find((item) => item.id === spot.id) : null;

      if (sameName && (!sameId || sameName.id !== sameId.id)) {
        const replaceExisting = await showConfirmBanner({
          title: "Spot name already exists",
          text: `There is already a saved spot called "${name}". Press OK to replace it, or Cancel to keep the old one.`,
          confirmLabel: "OK, replace",
          cancelLabel: "Cancel",
          safe: true
        });

        if (!replaceExisting) return false;
      }

      const normalized = normalizeSpot({
        ...spot,
        id: spot.id || makeSpotId(spot),
        name,
        namedAtMillis: Date.now()
      });

      named = named.filter((item) =>
        item.id !== normalized.id &&
        (item.name || "").toLowerCase() !== name.toLowerCase()
      );

      if (named.length >= MAX_NAMED_LOCATIONS) {
        const replaceOldest = await showConfirmBanner({
          title: "Saved spots are full",
          text: "You already have 10 saved spots. Replace the oldest one with this new saved spot?",
          confirmLabel: "Replace oldest",
          cancelLabel: "Cancel",
          safe: true
        });

        if (!replaceOldest) return false;
        named = named.slice(0, MAX_NAMED_LOCATIONS - 1);
      }

      const next = [normalized, ...named].slice(0, MAX_NAMED_LOCATIONS);
      writeNamedLocations(next);
      savedPanelIndex = 0;
      renderSpotLists();

      setHeroState(
        "saved",
        "Location saved with name",
        name,
        `Accuracy: ${formatAccuracy(normalized.accuracy)}`
      );

      syncAllParkingDataToCloud(lastKnownSpot || readLocalBackup(), {
        cloudFailureTitle: "Saved locally"
      });

      return true;
    }

    async function handleSpotListClick(event) {
      const button = event.target.closest("button[data-action]");

      if (!button) {
        const row = event.target.closest(".dropdown-spot-row[data-list]");
        if (row) {
          event.preventDefault();
          event.stopPropagation();
          selectPanelIndex(row.dataset.list, row.dataset.index);
        }
        return;
      }

      event.preventDefault();
      event.stopPropagation();

      const spot = getSpotFromList(button.dataset.list, button.dataset.index);
      if (!spot) return;

      if (button.dataset.action === "show") {
        openSpotOnMap(spot, false);
        return;
      }

      if (button.dataset.action === "navigate") {
        openSpotOnMap(spot, true);
        return;
      }

      if (button.dataset.action === "share") {
        await shareSpot(spot);
        return;
      }

      if (button.dataset.action === "save-name") {
        await saveSpotWithName(spot);
        return;
      }

      if (button.dataset.action === "delete") {
        await deleteSpotFromList(button.dataset.list, button.dataset.index);
      }
    }

    async function ensureAnonymousLogin() {
      return new Promise((resolve, reject) => {
        const unsubscribe = onAuthStateChanged(auth, async (user) => {
          if (user) {
            currentUser = user;
            unsubscribe();
            resolve(user);
            return;
          }

          try {
            const result = await signInAnonymously(auth);
            currentUser = result.user;
            unsubscribe();
            resolve(result.user);
          } catch (error) {
            unsubscribe();
            reject(error);
          }
        });
      });
    }

    const loginReadyPromise = ensureAnonymousLogin()
      .then((user) => {
        currentUser = user;
        setPill(cloudPillEl, "Cloud: connected", "ok");
        return user;
      })
      .catch((error) => {
        console.error("Cloud login failed. App will continue locally.", error);
        setPill(cloudPillEl, "Cloud: auth failed", "warn");
        return null;
      });

    async function syncAllParkingDataToCloud(currentSpot = lastKnownSpot || readLocalBackup(), {
      clearCurrent = false,
      silent = false,
      cloudFailureTitle = "Saved locally"
    } = {}) {
      try {
        let user = currentUser;

        if (!user && loginReadyPromise) {
          user = await loginReadyPromise;
        }

        if (!user) {
          if (!silent) setPill(cloudPillEl, "Cloud: offline", "warn");
          return false;
        }

        const recentSpots = readRecentSpots();
        const namedLocations = readNamedLocations();

        const payload = {
          profileId: guestProfileId,
          ownerUid: user.uid,
          recentSpots,
          namedLocations,
          updatedAtMillis: Date.now(),
          savedAt: serverTimestamp()
        };

        if (clearCurrent) {
          payload.currentCleared = true;
          payload.lat = null;
          payload.lng = null;
          payload.accuracy = null;
          payload.source = "cleared";
          payload.savedAtMillis = null;
          payload.id = null;
        } else if (
          currentSpot &&
          typeof currentSpot.lat === "number" &&
          typeof currentSpot.lng === "number"
        ) {
          const normalizedSpot = normalizeSpot(currentSpot);
          Object.assign(payload, normalizedSpot, { currentCleared: false });
        }

        try {
          await setDoc(getParkingDocRef(), payload, { merge: true });
          if (!silent) setPill(cloudPillEl, "Cloud: synced", "ok");
          debugLog("Cloud profile synced", {
            profileId: guestProfileId,
            recent: recentSpots.length,
            saved: namedLocations.length
          });
          return true;
        } catch (profileError) {
          console.warn("Profile cloud sync failed. Trying legacy user path.", profileError);
          debugLog("Profile cloud sync failed", {
            code: profileError?.code,
            message: profileError?.message
          });

          await setDoc(getLegacyParkingDocRef(user.uid), payload, { merge: true });
          if (!silent) setPill(cloudPillEl, "Cloud: synced fallback", "ok");
          return true;
        }
      } catch (cloudError) {
        console.error("Cloud sync failed:", cloudError);
        if (!silent) {
          setPill(cloudPillEl, "Cloud: pending/failed", "warn");

          if (currentSpot && !clearCurrent) {
            const normalizedSpot = normalizeSpot(currentSpot);
            setHeroState(
              "saved",
              cloudFailureTitle,
              "",
              `Saved: ${formatDate(normalizedSpot.savedAtMillis)} • Accuracy: ${Math.round(normalizedSpot.accuracy || 0)}m`
            );
          }
        }

        return false;
      }
    }

    async function loadCloudSpot() {
      if (!currentUser) return null;

      try {
        let data = null;
        let loadedFrom = "profile";

        try {
          const profileSnap = await getDoc(getParkingDocRef());
          if (profileSnap.exists()) {
            data = profileSnap.data();
          }
        } catch (profileError) {
          console.warn("Profile cloud load failed. Trying legacy user path.", profileError);
          debugLog("Profile cloud load failed", {
            code: profileError?.code,
            message: profileError?.message
          });
        }

        if (!data) {
          const legacySnap = await getDoc(getLegacyParkingDocRef(currentUser.uid));

          if (legacySnap.exists()) {
            data = legacySnap.data();
            loadedFrom = "legacy";
          }
        }

        if (!data) {
          setPill(cloudPillEl, "Cloud: new profile", "ok");
          await syncAllParkingDataToCloud(lastKnownSpot || readLocalBackup(), { silent: true });
          return null;
        }

        const localRecent = readRecentSpots();
        const localNamed = readNamedLocations();
        const mergedRecent = mergeRecentSpots(localRecent, Array.isArray(data.recentSpots) ? data.recentSpots : []);
        const mergedNamed = mergeNamedLocations(localNamed, Array.isArray(data.namedLocations) ? data.namedLocations : []);

        writeRecentSpots(mergedRecent);
        writeNamedLocations(mergedNamed);
        renderSpotLists();

        debugLog("Cloud data merged", {
          from: loadedFrom,
          recent: mergedRecent.length,
          saved: mergedNamed.length
        });

        let spot = null;

        if (typeof data.lat === "number" && typeof data.lng === "number") {
          spot = normalizeSpot({
            id: data.id || null,
            lat: data.lat,
            lng: data.lng,
            accuracy: data.accuracy || null,
            source: data.source || "cloud",
            savedAtMillis: data.savedAtMillis || null
          });
        }

        // Push the merged local+cloud lists back, so saved spots do not disappear
        // when Safari and the Home Screen app have different local storage.
        await syncAllParkingDataToCloud(spot || lastKnownSpot || readLocalBackup(), { silent: true });

        setPill(cloudPillEl, "Cloud: ready", "ok");
        return spot;
      } catch (error) {
        console.error(error);
        setPill(cloudPillEl, "Cloud: unavailable", "warn");
        return null;
      }
    }

    function getCurrentLocationOnce(options = {}) {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Geolocation is not supported on this device/browser."));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => resolve(position),
          (error) => reject(error),
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0,
            ...options
          }
        );
      });
    }

    async function getCachedFallbackLocation() {
      try {
        const position = await getCurrentLocationOnce({
          enableHighAccuracy: false,
          timeout: 4000,
          maximumAge: CACHED_FALLBACK_MAX_AGE_MS
        });
        return position;
      } catch (error) {
        return null;
      }
    }

    async function getHybridBestLocation() {
      vibratePattern("search-start");
      debugLog("GPS search started", { ios: isIOSDevice(), href: window.location.href });

      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Geolocation is not supported on this device/browser."));
          return;
        }

        let bestPosition = null;
        let watchId = null;
        let finished = false;
        let lastUiUpdateAt = 0;
        let timeoutId = null;

        const startedAt = Date.now();
        const iosMode = isIOSDevice();
        const liveTimeoutMs = iosMode ? 18000 : LIVE_SEARCH_TIMEOUT_MS;
        const hardFallbackTimeoutMs = iosMode ? 26000 : 10500;
        const cachedTimeoutMs = iosMode ? 1400 : 900;
        const fastGraceMs = iosMode ? 1800 : FIRST_FAST_FIX_GRACE_MS;
        const fastAccuracyLimit = iosMode ? 120 : FAST_ACCEPTABLE_ACCURACY_METERS;

        function clearGpsWatch() {
          if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
          }

          if (timeoutId !== null) {
            clearTimeout(timeoutId);
            timeoutId = null;
          }
        }

        function finishSuccess(payload) {
          if (finished) return;
          finished = true;
          clearGpsWatch();
          resolve(payload);
        }

        function finishFailure(error) {
          if (finished) return;
          finished = true;
          clearGpsWatch();
          reject(error);
        }

        function maybeUpdateBest(position) {
          const accuracy = position?.coords?.accuracy;
          if (typeof accuracy !== "number") return;

          if (!bestPosition || accuracy < bestPosition.coords.accuracy) {
            bestPosition = position;
          }
        }

        function updateSearchingUi(stageLabel = "Finding location") {
          if (finished) return;
          const now = Date.now();
          if (now - lastUiUpdateAt < LIVE_MIN_UPDATE_INTERVAL_MS) return;

          lastUiUpdateAt = now;

          setHeroState(
            "searching",
            "Saving your parking spot",
            stageLabel,
            bestPosition
              ? `Accuracy: ${Math.round(bestPosition.coords.accuracy)}m`
              : "Getting first GPS fix..."
          );
        }

        function acceptIfGoodEnough(position, source) {
          if (finished) return true;
          const accuracy = position.coords.accuracy;
          const elapsed = Date.now() - startedAt;

          if (accuracy <= TARGET_ACCURACY_METERS) {
            finishSuccess({
              position,
              accepted: true,
              source
            });
            return true;
          }

          if (
            elapsed >= fastGraceMs &&
            accuracy <= fastAccuracyLimit
          ) {
            finishSuccess({
              position,
              accepted: true,
              source: `${source}-fast`
            });
            return true;
          }

          return false;
        }

        // 1) Try a fast cached position immediately.
        // This does not block the live GPS watch below.
        navigator.geolocation.getCurrentPosition(
          (position) => {
            if (finished) return;
            debugLog("Cached GPS result", { accuracy: position?.coords?.accuracy });
            maybeUpdateBest(position);
            acceptIfGoodEnough(position, "cached");
          },
          (error) => {
            debugLog("Cached GPS error", { code: error?.code, message: error?.message });
            // Ignore cached errors. Live GPS is running below.
          },
          {
            enableHighAccuracy: false,
            timeout: cachedTimeoutMs,
            maximumAge: CACHED_FALLBACK_MAX_AGE_MS
          }
        );

        updateSearchingUi("Starting GPS immediately...");

        if (iosMode) {
          // iOS/Safari sometimes resolves watchPosition slowly when opened from NFC.
          // This parallel one-shot often wakes up the location service faster.
          navigator.geolocation.getCurrentPosition(
            (position) => {
              if (finished) return;
              debugLog("iOS one-shot GPS result", { accuracy: position?.coords?.accuracy });
              maybeUpdateBest(position);
              acceptIfGoodEnough(position, "ios-one-shot");
            },
            (error) => {
              debugLog("iOS one-shot GPS error", { code: error?.code, message: error?.message });
            },
            {
              enableHighAccuracy: true,
              maximumAge: 0,
              timeout: liveTimeoutMs
            }
          );
        }

        // 2) Start live GPS immediately. No Firebase, old location, or UI load before this.
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            if (finished) return;
            debugLog("Live GPS result", { accuracy: position?.coords?.accuracy });
            maybeUpdateBest(position);
            updateSearchingUi("Improving GPS...");

            acceptIfGoodEnough(position, "live");
          },
          (error) => {
            if (finished) return;
            debugLog("Live GPS error", { code: error?.code, message: error?.message });
            if (bestPosition) {
              finishSuccess({
                position: bestPosition,
                accepted: bestPosition.coords.accuracy <= fastAccuracyLimit,
                source: "best-available-after-error",
                error
              });
              return;
            }

            finishFailure(error || new Error("Could not get a usable location."));
          },
          {
            enableHighAccuracy: true,
            maximumAge: 15000,
            timeout: liveTimeoutMs
          }
        );

        timeoutId = setTimeout(() => {
          if (bestPosition) {
            finishSuccess({
              position: bestPosition,
              accepted: bestPosition.coords.accuracy <= fastAccuracyLimit,
              source: "timeout-best"
            });
            return;
          }

          finishFailure(new Error("Could not get a usable location."));
        }, hardFallbackTimeoutMs);
      });
    }

    async function persistSpot(spot, cloudFailureTitle = "Saved locally") {
      // First save locally, immediately.
      const normalizedSpot = normalizeSpot(spot);
      saveLocalBackup(normalizedSpot);
      addRecentSpot(normalizedSpot);
      setActivePreviewSpot(normalizedSpot);
      updateHeroFromSpot(normalizedSpot);
      vibratePattern("success");

      // Cloud sync runs in the background.
      // It must never block the NFC save flow.
      syncAllParkingDataToCloud(normalizedSpot, { cloudFailureTitle });

      return true;
    }

    async function saveParkingLocation() {
      hideSaveAnyway();
      setBusy(true);

      try {
        // VERY IMPORTANT:
        // GPS starts here immediately. Do not put cloud login, old location load,
        // or any other await before this line.
        const locationPromise = getHybridBestLocation();

        setPill(modePillEl, "Mode: saving", "warn");
        setHeroState(
          "searching",
          "Saving your parking spot",
          "GPS started immediately...",
          "Do not close this page."
        );

        const result = await locationPromise;
        const position = result.position;
        const measuredAccuracy = position.coords.accuracy;

        const spot = {
          lat: position.coords.latitude,
          lng: position.coords.longitude,
          accuracy: measuredAccuracy,
          source: result.source || "gps",
          savedAtMillis: Date.now()
        };
        spot.id = makeSpotId(spot);

        if (!result.accepted) {
          bestFailedSpot = spot;
          setPill(localPillEl, `Best found: ${Math.round(measuredAccuracy || 0)}m`, "warn");
          setHeroState(
            "error",
            "Accuracy not good enough",
            `Best result: ${Math.round(measuredAccuracy || 0)}m`,
            result.source && result.source.includes("cached")
              ? `Using cached location fallback • Required: ${FAST_ACCEPTABLE_ACCURACY_METERS}m or better`
              : `Required: ${FAST_ACCEPTABLE_ACCURACY_METERS}m or better`
          );
          showSaveAnyway();
          vibratePattern("error");
          return false;
        }

        return await persistSpot(spot);
      } catch (error) {
        console.error(error);
        debugLog("Save location failed", { code: error?.code, message: error?.message });

        if (error.code === 1) {
          debugLog("Permission denied by browser/location settings", { ios: isIOSDevice(), userAgent: navigator.userAgent });
          setHeroState(
            "error",
            "Location permission denied",
            isIOSDevice()
              ? "iPhone blocked location access. Allow Location for this browser/site once, then use the Home Screen shortcut."
              : "Please allow location access for this site.",
            isIOSDevice()
              ? "Settings → Privacy & Security → Location Services → Safari/Chrome → While Using App"
              : ""
          );
        } else if (error.code === 2) {
          setHeroState("error", "Location unavailable", "Try going near a window or enabling precise location.");
        } else if (error.code === 3) {
          setHeroState("error", "Location request timed out", "Try again or open the installed shortcut/PWA.");
        } else {
          setHeroState("error", "Could not get location", error?.message || "");
        }

        vibratePattern("error");
        return false;
      } finally {
        setBusy(false);
      }
    }

    function setActivePreviewSpot(spot) {
      if (!spot || typeof spot.lat !== "number" || typeof spot.lng !== "number") {
        activePreviewSpot = null;
        return null;
      }

      activePreviewSpot = normalizeSpot(spot);
      lastKnownSpot = activePreviewSpot;
      return activePreviewSpot;
    }

    function getActivePreviewSpot() {
      if (activePreviewSpot && typeof activePreviewSpot.lat === "number" && typeof activePreviewSpot.lng === "number") {
        return normalizeSpot(activePreviewSpot);
      }

      if (lastKnownSpot && typeof lastKnownSpot.lat === "number" && typeof lastKnownSpot.lng === "number") {
        return normalizeSpot(lastKnownSpot);
      }

      const localSpot = readLocalBackup();
      if (localSpot) return normalizeSpot(localSpot);

      const recent = readRecentSpots();
      if (recent.length) return normalizeSpot(recent[0]);

      const named = readNamedLocations();
      if (named.length) return normalizeSpot(named[0]);

      return null;
    }

    function getBestAvailableSpot() {
      const activeSpot = getActivePreviewSpot();
      if (activeSpot) return { spot: activeSpot };

      return { spot: null };
    }

    async function showSavedLocation() {
      hideSaveAnyway();
      setBusy(true);

      try {
        const chosen = getActivePreviewSpot();

        if (!chosen) {
          setHeroState("error", "No saved location found", "");
          return;
        }

        const activeSpot = setActivePreviewSpot(chosen);
        updateHeroFromSpot(activeSpot);
        openSpotOnMap(activeSpot, false);
      } finally {
        setBusy(false);
      }
    }

      setBusy(true);

      try {

        if (!chosen) {
          setHeroState("error", "No saved location found", "");
          return;

    async function clearSavedLocation() {
      hideSaveAnyway();

      const confirmed = await showConfirmBanner({
        title: "Clear current parking spot?",
        text: "This will remove only the current saved parking spot. Your recent history and saved spots will stay available.",
        confirmLabel: "Yes, clear it",
        cancelLabel: "Cancel"
      });

      if (!confirmed) return;

      setBusy(true);
      setHeroState("waiting", "Clearing current spot", "");

      try {
        clearLocalBackup();
        sessionStorage.removeItem(SESSION_SAVE_KEY);
        lastKnownSpot = null;
        activePreviewSpot = null;

        await syncAllParkingDataToCloud(null, {
          clearCurrent: true,
          cloudFailureTitle: "Cleared locally"
        });

        setHeroState("waiting", "Current spot cleared", "Recent and saved spots are still saved.");
      } finally {
        setBusy(false);
      }
    }

    async function saveBestFoundAnyway() {
      if (!bestFailedSpot) return;

      hideSaveAnyway();
      setBusy(true);

      try {
        await persistSpot(bestFailedSpot, "Saved locally");
        sessionStorage.setItem(SESSION_SAVE_KEY, "true");
        clearSaveModeFromUrl();
        setPill(modePillEl, "Mode: view only");
      } finally {
        setBusy(false);
      }
    }

    function cancelSaveAnyway() {
      hideSaveAnyway();
      setHeroState("waiting", "Save cancelled", "");
      clearSaveModeFromUrl();
      setPill(modePillEl, "Mode: view only");
    }

    async function saveCurrentSpotWithName() {
      const chosen = getActivePreviewSpot();
      await saveSpotWithName(chosen);
    }

    async function shareCurrentSpot() {
      const chosen = getActivePreviewSpot();

      if (!chosen) {
        setHeroState("error", "No spot to share", "Save or select a spot first.");
        return;
      }

      await shareSpot(chosen);
    }

    showBtn.addEventListener("click", showSavedLocation);
    navigateBtn.addEventListener("click", navigateToSavedLocation);
    if (shareCurrentBtn) shareCurrentBtn.addEventListener("click", shareCurrentSpot);
    saveNamedBtn.addEventListener("click", saveCurrentSpotWithName);
    clearBtn.addEventListener("click", clearSavedLocation);
    cancelSaveBtn.addEventListener("click", cancelSaveAnyway);
    saveAnywayBtn.addEventListener("click", saveBestFoundAnyway);
    recentListEl.addEventListener("click", handleSpotListClick);
    savedListEl.addEventListener("click", handleSpotListClick);
    recentDropdownEl.addEventListener("click", handleSpotListClick);
    savedDropdownEl.addEventListener("click", handleSpotListClick);
    listBackdropEl.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      closeAllDropdowns();
    });

    if (spotListModalEl) {
      spotListModalEl.addEventListener("click", handleSpotListModalClick);
    }

    document.addEventListener("click", (event) => {
      if (Date.now() < ignoreUnderlyingClickUntil) {
        event.preventDefault();
        event.stopPropagation();
      }
    }, true);
    recentToggleBtn.addEventListener("click", () => toggleSpotListModal("recent"));
    savedToggleBtn.addEventListener("click", () => toggleSpotListModal("named"));
    bindPanelHeaderToggle(recentPanelEl, recentDropdownEl);
    bindPanelHeaderToggle(savedPanelEl, savedDropdownEl);
    enableCarouselSwipe(recentListEl, "recent");
    enableCarouselSwipe(savedListEl, "named");

    async function init() {
      renderSpotLists();
      setBusy(true);

      if (currentMode === "save") {
        setPill(modePillEl, "Mode: NFC save", "ok");
        setPill(localPillEl, "Local backup: skipped during save", "warn");

        setHeroState(
          "searching",
          "Saving your parking spot",
          "Starting GPS immediately...",
          "Previous location will not be loaded during NFC save."
        );

        // NFC flow:
        // Start GPS/save first. Do not load old location. Do not wait for Firebase.
        const savedSuccessfully = await saveParkingLocation();

        if (savedSuccessfully) {
          sessionStorage.setItem(SESSION_SAVE_KEY, "true");
          clearSaveModeFromUrl();
          setPill(modePillEl, "Mode: view only");
        }

        return;
      }

      setPill(modePillEl, "Mode: view only");

      const localSpot = readLocalBackup();
      if (localSpot) {
        setActivePreviewSpot(localSpot);
        updateHeroFromSpot(localSpot);
      } else {
        setHeroState("waiting", "No saved location", "");
      }

      try {
        const user = await loginReadyPromise;

        if (user) {
          const cloudSpot = await loadCloudSpot();

          if (cloudSpot) {
            setActivePreviewSpot(cloudSpot);
            saveLocalBackup(cloudSpot);
            updateHeroFromSpot(cloudSpot);
          }
        }
      } catch (error) {
        console.error(error);
      } finally {
        setBusy(false);
      }
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          await navigator.serviceWorker.register("./sw.js");
        } catch (error) {
          console.error("Service worker registration failed:", error);
        }
      });
    }

    init();
  
  </script>

  <script>
    (() => {
      const compactHeroStatus = () => {
        const hero = document.getElementById("hero");
        const title = document.getElementById("heroTitle");
        if (!hero || !title) return;

        const raw = (title.textContent || "").trim().toLowerCase();

        if (raw.includes("saved") || raw.includes("location saved")) {
          title.textContent = "SAVED";
          return;
        }

        if (raw.includes("saving")) {
          title.textContent = "SAVING";
          return;
        }

        if (raw.includes("search") || raw.includes("gps")) {
          title.textContent = "SEARCHING";
          return;
        }

        if (raw.includes("cleared") || raw.includes("clear")) {
          title.textContent = "CLEARED";
          return;
        }

        if (raw.includes("starting") || raw.includes("preparing")) {
          title.textContent = "STARTING";
          return;
        }

        if (raw.includes("error") || hero.classList.contains("error")) {
          title.textContent = "ERROR";
        }
      };

      window.addEventListener("DOMContentLoaded", () => {
        const title = document.getElementById("heroTitle");
        compactHeroStatus();

        if (title) {
          new MutationObserver(compactHeroStatus).observe(title, {
            childList: true,
            characterData: true,
            subtree: true
          });
        }

        setInterval(compactHeroStatus, 900);
      });
    })();
  </script>

  <script>
    (() => {
      const syncHeroMetaStack = () => {
        const source = document.getElementById("heroMeta");
        const dateEl = document.getElementById("heroMetaDate");
        const timeEl = document.getElementById("heroMetaTime");
        const accEl = document.getElementById("heroMetaAccuracy");

        if (!source || !dateEl || !timeEl || !accEl) return;

        const raw = (source.textContent || "")
          .replace(/\s+/g, " ")
          .replace(/^Saved:\s*/i, "")
          .trim();

        let date = "";
        let time = "";
        let accuracy = "";

        const accuracyMatch = raw.match(/Accuracy:\s*([^•]+)/i);
        if (accuracyMatch) {
          accuracy = `Accuracy: ${accuracyMatch[1].trim()}`;
        }

        const clean = raw
          .replace(/•\s*Accuracy:\s*[^•]+/i, "")
          .replace(/Accuracy:\s*[^•]+/i, "")
          .trim();

        const dateTimeMatch = clean.match(/(\d{1,2}\/\d{1,2}\/\d{4}),?\s*(\d{1,2}:\d{2}(?::\d{2})?)/);

        if (dateTimeMatch) {
          date = dateTimeMatch[1];
          time = dateTimeMatch[2];
        } else {
          date = clean.replace(/^Saved:\s*/i, "").slice(0, 24);
        }

        dateEl.textContent = date;
        timeEl.textContent = time;
        accEl.textContent = accuracy;
      };

      window.addEventListener("DOMContentLoaded", () => {
        const source = document.getElementById("heroMeta");
        syncHeroMetaStack();

        if (source) {
          new MutationObserver(syncHeroMetaStack).observe(source, {
            childList: true,
            characterData: true,
            subtree: true
          });
        }

        setInterval(syncHeroMetaStack, 800);
      });
    })();
  </script>

  <script>
    (() => {
      const zoneActions = [
        { id: "showBtn", x1: 0.055, y1: 0.155, x2: 0.420, y2: 0.365 },
        { id: "navigateBtn", x1: 0.580, y1: 0.155, x2: 0.945, y2: 0.365 },
        { id: "saveNamedBtn", x1: 0.055, y1: 0.435, x2: 0.420, y2: 0.655 },
        { id: "shareCurrentBtn", x1: 0.580, y1: 0.435, x2: 0.945, y2: 0.655 },
        { id: "clearBtn", x1: 0.410, y1: 0.565, x2: 0.590, y2: 0.680 }
      ];

      const triggerButtonById = (id) => {
        const button = document.getElementById(id);
        if (!button || button.disabled) return false;
        button.dispatchEvent(new MouseEvent("click", {
          bubbles: true,
          cancelable: true,
          view: window
        }));
        return true;
      };

      const handleBoardPointer = (event) => {
        if (!event.isTrusted) return;

        const modal = document.getElementById("spotListModal");
        if (modal && !modal.hidden) return;

        const directButton = event.target.closest?.("button");
        if (directButton && !directButton.classList.contains("cockpit-btn") && !directButton.classList.contains("cockpit-delete")) {
          return;
        }

        const board = document.querySelector(".template-board");
        if (!board) return;

        const rect = board.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width;
        const y = (event.clientY - rect.top) / rect.height;

        const zone = zoneActions.find((item) =>
          x >= item.x1 && x <= item.x2 && y >= item.y1 && y <= item.y2
        );

        if (!zone) return;

        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();

        triggerButtonById(zone.id);
      };

      window.addEventListener("click", handleBoardPointer, true);
      window.addEventListener("touchend", (event) => {
        const touch = event.changedTouches && event.changedTouches[0];
        if (!touch) return;
        const synthetic = {
          isTrusted: true,
          target: event.target,
          clientX: touch.clientX,
          clientY: touch.clientY,
          preventDefault: () => event.preventDefault(),
          stopPropagation: () => event.stopPropagation(),
          stopImmediatePropagation: () => event.stopImmediatePropagation()
        };
        handleBoardPointer(synthetic);
      }, { capture: true, passive: false });
    })();
  </script>
