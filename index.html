<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>ParkNous</title>

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
    <link rel="preload" as="image" href="./favicon.png" />
  <link rel="preload" as="image" href="./parknous_onlytext.svg" />
  <meta name="theme-color" content="#0a0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ParkNous" />

  <style>
    @font-face {
      font-family: "Mous";
      src: url("./fonts/mous.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-1: #07090d;
      --bg-2: #10141d;
      --bg-3: #171c27;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.15);
      --text: #ffffff;
      --muted: #aeb6c7;
      --accent: #ffd84d;
      --success-soft: rgba(53, 208, 127, 0.16);
      --danger-soft: rgba(255, 109, 109, 0.15);
      --search-soft: rgba(77, 144, 254, 0.18);
      --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.42);
      --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.34);
      --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.26);
      --radius-xl: 30px;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top center, rgba(255, 216, 77, 0.16), transparent 18%),
        radial-gradient(circle at bottom left, rgba(94, 160, 255, 0.10), transparent 24%),
        linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 40%, var(--bg-1) 100%);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .app {
      width: min(100%, 430px);
      height: calc(100dvh - 20px);
      max-height: calc(100dvh - 20px);
      border-radius: var(--radius-xl);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.022));
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: var(--shadow-xl);
      backdrop-filter: blur(16px);
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.06), transparent 22%),
        linear-gradient(315deg, rgba(255,216,77,0.05), transparent 24%);
      pointer-events: none;
    }

    .top {
      position: relative;
      padding: 14px 18px 14px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
    }

    .title {
      margin: 0;
      font-family: "Mous", Inter, Arial, sans-serif;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 58px;
      font-size: clamp(1.32rem, 5vw, 1.72rem);
      font-weight: 950;
      letter-spacing: 0.34px;
      color: var(--accent);
      text-shadow:
        0 0 18px rgba(255, 216, 77, 0.14),
        0 0 36px rgba(255, 216, 77, 0.05);
    }

    .title-logo {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border-radius: 14px;
      object-fit: contain;
      display: block;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.10),
        0 8px 18px rgba(0,0,0,0.22),
        0 0 18px rgba(255, 216, 77, 0.12);
    }

    .title-wordmark {
      width: min(58vw, 255px);
      height: 54px;
      flex: 0 1 auto;
      object-fit: contain;
      display: block;
      transform: scale(1.28);
      transform-origin: left center;
      filter:
        drop-shadow(0 0 12px rgba(255, 216, 77, 0.24))
        drop-shadow(0 0 24px rgba(255, 216, 77, 0.10));
    }

    .content {
      position: relative;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    .hero {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(31, 36, 50, 0.96), rgba(18, 22, 31, 0.99));
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 16px 14px 14px;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent 28%);
      pointer-events: none;
    }

    .hero-icon-wrap {
      position: relative;
      width: 82px;
      height: 82px;
      margin: 0 auto 12px;
    }

    .hero-icon {
      position: relative;
      z-index: 2;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.85rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line-strong);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 6px 18px rgba(0,0,0,0.18);
      transition: all 0.28s ease;
    }

    .brand-logo {
      width: 78%;
      height: 78%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 0 18px rgba(34, 211, 238, 0.75));
      animation: logoPulse 2.15s ease-in-out infinite;
    }

    .hero.searching .brand-logo {
      animation: logoPulse 0.9s ease-in-out infinite, logoSpinHint 2.8s linear infinite;
      filter: drop-shadow(0 0 28px rgba(34, 211, 238, 0.98));
    }

    @keyframes logoPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 14px rgba(34, 211, 238, 0.66));
      }

      50% {
        transform: scale(1.12);
        filter: drop-shadow(0 0 34px rgba(56, 189, 248, 1));
      }
    }

    @keyframes logoSpinHint {
      0% { rotate: 0deg; }
      100% { rotate: 360deg; }
    }

    .hero.saved .hero-icon {
      background: var(--success-soft);
      border-color: rgba(53, 208, 127, 0.35);
      box-shadow:
        0 0 0 8px rgba(53, 208, 127, 0.06),
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 10px 24px rgba(0,0,0,0.20);
      transform: scale(1.03);
    }

    .hero.waiting .hero-icon {
      background: rgba(255, 216, 77, 0.10);
      border-color: rgba(255, 216, 77, 0.24);
      box-shadow:
        0 0 0 8px rgba(255, 216, 77, 0.04),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .hero.searching .hero-icon {
      background: rgba(77, 144, 254, 0.28);
      border-color: rgba(34, 211, 238, 0.68);
      box-shadow:
        0 0 0 10px rgba(34, 211, 238, 0.10),
        0 0 34px rgba(34, 211, 238, 0.45),
        inset 0 1px 0 rgba(255,255,255,0.12);
      animation: searchGlow 0.95s ease-in-out infinite;
    }

    @keyframes searchGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 0 8px rgba(34, 211, 238, 0.09),
          0 0 24px rgba(34, 211, 238, 0.38),
          inset 0 1px 0 rgba(255,255,255,0.12);
      }

      50% {
        transform: scale(1.08);
        box-shadow:
          0 0 0 16px rgba(34, 211, 238, 0.15),
          0 0 46px rgba(34, 211, 238, 0.72),
          inset 0 1px 0 rgba(255,255,255,0.16);
      }
    }

    .hero.error .hero-icon {
      background: var(--danger-soft);
      border-color: rgba(255, 109, 109, 0.28);
      box-shadow:
        0 0 0 8px rgba(255, 109, 109, 0.04),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .radar-ring,
    .radar-ring-2 {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(34, 211, 238, 0.78);
      opacity: 0;
      transform: scale(0.7);
      pointer-events: none;
      display: none;
    }

    .hero.searching .radar-ring,
    .hero.searching .radar-ring-2 {
      display: block;
    }

    .hero.searching .radar-ring {
      animation: radarPulse 1.15s infinite;
    }

    .hero.searching .radar-ring-2 {
      animation: radarPulse 1.15s infinite 0.52s;
    }

    @keyframes radarPulse {
      0% { transform: scale(0.68); opacity: 0.95; }
      100% { transform: scale(1.72); opacity: 0; }
    }

    .hero-title {
      font-size: clamp(1rem, 4vw, 1.14rem);
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    .hero-text {
      color: #eef2f8;
      line-height: 1.4;
      min-height: 20px;
      font-size: 0.93rem;
      padding: 0 2px;
    }

    .hero-meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.79rem;
      line-height: 1.35;
      word-break: break-word;
      min-height: 16px;
      padding: 0 2px;
    }

    .action-row {
      display: none;
      gap: 8px;
      margin-top: 12px;
    }

    .action-row.show {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .mini-btn {
      min-height: 44px;
      border-radius: 14px;
      border: none;
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: linear-gradient(180deg, #6ba8ff, #447fea);
      box-shadow: var(--shadow-md);
      font-size: 0.92rem;
    }

    .mini-btn.cancel {
      background: linear-gradient(180deg, #6f737c, #4f545d);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 1px;
      align-content: start;
    }

    .pill {
      padding: 8px 11px;
      border-radius: 999px;
      font-size: 0.74rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      color: #eff3fa;
      backdrop-filter: blur(6px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      white-space: nowrap;
    }

    .pill.ok {
      color: #d3ffe4;
      border-color: rgba(53, 208, 127, 0.18);
    }

    .pill.warn {
      color: #ffe9b3;
      border-color: rgba(255, 204, 102, 0.18);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-content: start;
      min-height: 0;
    }

    button {
      appearance: none;
      border: none;
      width: 100%;
      min-height: 54px;
      border-radius: var(--radius-md);
      cursor: pointer;
      padding: 13px 14px;
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: 0.2px;
      color: white;
      transition: transform 0.12s ease, opacity 0.18s ease, filter 0.18s ease;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.16), transparent 38%);
      pointer-events: none;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.58;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .show-btn,
    .nav-btn,
    .save-named-btn,
    .clear-btn {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: center;
      text-align: left;
    }

    .show-btn {
      background: linear-gradient(180deg, #6fb0ff, #447fea);
    }

    .nav-btn {
      background: linear-gradient(180deg, #4ea6ff, #297ae7);
    }

    .save-named-btn {
      background: linear-gradient(180deg, #35d0a2, #178f75);
      grid-column: 1 / -1;
    }

    .clear-btn {
      background: linear-gradient(180deg, #ff7d7d, #e25656);
      grid-column: 1 / -1;
    }

    .btn-icon {
      font-size: 1.14rem;
      line-height: 1;
    }

    .btn-copy {
      display: grid;
      gap: 2px;
    }

    .btn-title {
      font-size: 0.93rem;
      line-height: 1.05;
    }

    .btn-subtitle {
      color: rgba(255,255,255,0.72);
      font-size: 0.68rem;
      line-height: 1.1;
      font-weight: 750;
    }

    .spot-panels {
      display: grid;
      gap: 10px;
      flex: 0 0 auto;
      min-height: 0;
      padding-bottom: 12px;
    }

    .spot-panel {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.045);
      border-radius: var(--radius-lg);
      padding: 10px;
      box-shadow: var(--shadow-md);
      overflow: visible;
    }

    .panel-head {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      user-select: none;
    }

    .panel-title {
      font-size: 0.88rem;
      font-weight: 950;
      letter-spacing: 0.2px;
      line-height: 1.1;
    }

    .panel-note {
      color: var(--muted);
      font-size: 0.66rem;
      white-space: nowrap;
      line-height: 1.2;
    }

    .panel-head-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-toggle {
      width: 46px;
      min-height: 46px;
      height: 46px;
      padding: 0;
      border-radius: 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
      display: grid;
      place-items: center;
      touch-action: manipulation;
      flex: 0 0 auto;
    }

    .panel-toggle::before,
    .panel-toggle::after {
      content: "";
      position: absolute;
      width: 13px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.82);
      top: 21px;
      transition: transform 0.18s ease;
    }

    .panel-toggle::before {
      transform: translateX(-3px) rotate(45deg);
    }

    .panel-toggle::after {
      transform: translateX(3px) rotate(-45deg);
    }

    .spot-panel.open .panel-toggle::before {
      transform: translateX(-3px) rotate(-45deg);
    }

    .spot-panel.open .panel-toggle::after {
      transform: translateX(3px) rotate(45deg);
    }

    .carousel-shell {
      overflow: hidden;
      border-radius: 16px;
      touch-action: pan-x;
    }

    .spot-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-padding: 0;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      scrollbar-width: none;
      cursor: grab;
    }

    .spot-list.dragging {
      scroll-snap-type: none;
      cursor: grabbing;
    }

    .spot-list::-webkit-scrollbar {
      display: none;
    }

    .spot-item {
      flex: 0 0 100%;
      min-width: 100%;
      scroll-snap-align: start;
      display: grid;
      gap: 8px;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.16);
    }

    .spot-row-main {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: start;
    }

    .spot-name {
      font-size: 0.82rem;
      font-weight: 900;
      line-height: 1.2;
      word-break: break-word;
    }

    .spot-meta-small {
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1.25;
      margin-top: 3px;
    }

    .spot-badge {
      color: #d3ffe4;
      font-size: 0.66rem;
      font-weight: 850;
      padding: 5px 7px;
      border-radius: 999px;
      background: rgba(53, 208, 127, 0.11);
      border: 1px solid rgba(53, 208, 127, 0.18);
      white-space: nowrap;
    }

    .spot-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .tiny-btn {
      min-height: 34px;
      padding: 8px 9px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 900;
      text-align: center;
      background: linear-gradient(180deg, #3d4656, #2b323f);
      box-shadow: none;
    }

    .tiny-btn.save-small {
      background: linear-gradient(180deg, #35d0a2, #178f75);
    }

    .tiny-btn.delete-small {
      background: linear-gradient(180deg, #ff7d7d, #d94d4d);
    }

    .empty-note {
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.35;
      padding: 3px 0;
    }

    .spot-dropdown {
      display: grid;
      gap: 7px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.08);
      max-height: 210px;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .spot-dropdown::-webkit-scrollbar {
      display: none;
    }

    .spot-dropdown[hidden] {
      display: none;
    }

    .dropdown-spot-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 7px;
      align-items: center;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(0,0,0,0.13);
    }

    .dropdown-main {
      min-width: 0;
      text-align: left;
    }

    .dropdown-name {
      font-size: 0.78rem;
      font-weight: 900;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dropdown-meta {
      color: var(--muted);
      font-size: 0.62rem;
      line-height: 1.15;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dropdown-icon-btn {
      width: 32px;
      min-height: 32px;
      height: 32px;
      padding: 0;
      border-radius: 11px;
      background: linear-gradient(180deg, #3d4656, #2b323f);
      box-shadow: none;
      font-size: 0.78rem;
    }

    .dropdown-icon-btn.good {
      background: linear-gradient(180deg, #35d0a2, #178f75);
    }

    .dropdown-icon-btn.bad {
      background: linear-gradient(180deg, #ff7d7d, #d94d4d);
    }

    .confirm-banner {
      position: fixed;
      left: 50%;
      bottom: 18px;
      width: min(calc(100% - 24px), 430px);
      transform: translate(-50%, calc(100% + 28px));
      opacity: 0;
      pointer-events: none;
      z-index: 30;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 24px;
      background: rgba(15, 18, 25, 0.96);
      box-shadow: 0 18px 50px rgba(0,0,0,0.50);
      backdrop-filter: blur(16px);
      padding: 14px;
      transition: transform 0.22s ease, opacity 0.22s ease;
    }

    .confirm-banner.show {
      transform: translate(-50%, 0);
      opacity: 1;
      pointer-events: auto;
    }

    .confirm-title {
      font-size: 0.95rem;
      font-weight: 950;
      margin-bottom: 4px;
    }

    .confirm-text {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .confirm-btn {
      min-height: 42px;
      border-radius: 14px;
      font-size: 0.82rem;
      text-align: center;
      box-shadow: none;
      background: linear-gradient(180deg, #6f737c, #4f545d);
    }

    .confirm-btn.yes {
      background: linear-gradient(180deg, #ff7d7d, #e25656);
    }

    .confirm-banner.safe .confirm-btn.yes {
      background: linear-gradient(180deg, #35d0a2, #178f75);
    }

    
    /* ParkNous v12 overrides */
    .top {
      padding: 12px 18px 8px;
      border-bottom: none;
      background: transparent;
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 68px;
      gap: 0;
    }

    .title-logo {
      display: none;
    }

    .title-wordmark {
      width: min(78vw, 310px);
      height: 68px;
      transform: none;
      transform-origin: center;
      filter:
        drop-shadow(0 0 12px rgba(255, 216, 77, 0.20))
        drop-shadow(0 0 26px rgba(255, 216, 77, 0.08));
    }

    .hero-icon-wrap {
      width: 108px;
      height: 108px;
      margin: 0 auto 14px;
    }

    .hero-icon {
      width: 108px;
      height: 108px;
      border-radius: 999px;
    }

    .brand-logo {
      width: 82%;
      height: 82%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 0 16px rgba(34, 211, 238, 0.42));
      animation: logoSpin 16s linear infinite;
    }

      return accuracy ? `${Math.round(accuracy)}m` : "unknown";
    }

    function makeSpotId(spot) {
      const time = spot.savedAtMillis || Date.now();
      const lat = typeof spot.lat === "number" ? spot.lat.toFixed(6) : "lat";
      const lng = typeof spot.lng === "number" ? spot.lng.toFixed(6) : "lng";
      return `${time}-${lat}-${lng}`;
    }

    function normalizeSpot(spot) {
      return {
        id: spot.id || makeSpotId(spot),
        name: spot.name || "",
        lat: spot.lat,
        lng: spot.lng,
        accuracy: spot.accuracy || null,
        source: spot.source || "gps",
        savedAtMillis: spot.savedAtMillis || Date.now(),
        namedAtMillis: spot.namedAtMillis || null
      };
    }

    function readStoredArray(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        console.error(error);
        return [];
      }
    }

    function writeStoredArray(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        console.error(error);
      }
    }

    function readRecentSpots() {
      return readStoredArray(HISTORY_KEY).map(normalizeSpot).slice(0, MAX_RECENT_SPOTS);
    }

    function writeRecentSpots(spots) {
      writeStoredArray(HISTORY_KEY, spots.map(normalizeSpot).slice(0, MAX_RECENT_SPOTS));
    }

    function readNamedLocations() {
      return readStoredArray(NAMED_LOCATIONS_KEY).map(normalizeSpot).slice(0, MAX_NAMED_LOCATIONS);
    }

    function writeNamedLocations(spots) {
      writeStoredArray(NAMED_LOCATIONS_KEY, spots.map(normalizeSpot).slice(0, MAX_NAMED_LOCATIONS));
    }

    function addRecentSpot(spot) {
      const normalized = normalizeSpot(spot);
      const recent = readRecentSpots()
        .filter((item) => item.id !== normalized.id)
        .filter((item) => !(Math.abs((item.savedAtMillis || 0) - normalized.savedAtMillis) < 1000));

      const next = [normalized, ...recent].slice(0, MAX_RECENT_SPOTS);
      writeRecentSpots(next);
      renderSpotLists();
      return next;
    }

    function showConfirmBanner({
      title = "Are you sure?",
      text = "",
      confirmLabel = "Yes",
      cancelLabel = "Cancel",
      safe = false
    } = {}) {
      return new Promise((resolve) => {
        confirmTitleEl.textContent = title;
        confirmTextEl.textContent = text;
        confirmYesBtn.textContent = confirmLabel;
        confirmNoBtn.textContent = cancelLabel;
        confirmBannerEl.classList.toggle("safe", safe);
        confirmBannerEl.classList.add("show");
        confirmBannerEl.setAttribute("aria-hidden", "false");

        const cleanup = (result) => {
          confirmBannerEl.classList.remove("show");
          confirmBannerEl.setAttribute("aria-hidden", "true");
          confirmYesBtn.removeEventListener("click", onYes);
          confirmNoBtn.removeEventListener("click", onNo);
          resolve(result);
        };

        const onYes = () => cleanup(true);
        const onNo = () => cleanup(false);

        confirmYesBtn.addEventListener("click", onYes, { once: true });
        confirmNoBtn.addEventListener("click", onNo, { once: true });
      });
    }

    function togglePanelDropdown(panelEl, dropdownEl) {
      const shouldOpen = dropdownEl.hidden;
      if (panelEl !== savedPanelEl) setPanelOpen(savedPanelEl, savedDropdownEl, false);
      if (panelEl !== recentPanelEl) setPanelOpen(recentPanelEl, recentDropdownEl, false);
      setPanelOpen(panelEl, dropdownEl, shouldOpen);

    function bindPanelHeaderToggle(panelEl, dropdownEl) {

      if (!head) return;

    function changePanelIndex(listName, delta) {
      const list = listName === "named" ? readNamedLocations() : readRecentSpots();
      if (!list.length) return;

      if (listName === "named") {
        savedPanelIndex = (savedPanelIndex + delta + list.length) % list.length;
      } else {
        recentPanelIndex = (recentPanelIndex + delta + list.length) % list.length;
      }

      renderSpotLists();
    }

    function selectPanelIndex(listName, index) {
      const list = listName === "named" ? readNamedLocations() : readRecentSpots();
      if (!list.length) return;

      const safeIndex = Math.max(0, Math.min(Number(index) || 0, list.length - 1));

      if (listName === "named") {
        savedPanelIndex = safeIndex;
        renderSpotLists();
        setPanelOpen(savedPanelEl, savedDropdownEl, false);
      } else {
        recentPanelIndex = safeIndex;
        renderSpotLists();
        setPanelOpen(recentPanelEl, recentDropdownEl, false);
      }
    }

    function enableCarouselSwipe(trackEl, listName) {
      if (!trackEl) return;

      let touchStartX = 0;
      let touchStartY = 0;

      trackEl.addEventListener("touchstart", (event) => {
        const touch = event.changedTouches[0];
        if (!touch) return;
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
      }, { passive: true });

      trackEl.addEventListener("touchend", (event) => {
        const touch = event.changedTouches[0];
        if (!touch) return;

        const dx = touch.clientX - touchStartX;
        const dy = touch.clientY - touchStartY;

        if (Math.abs(dx) > 34 && Math.abs(dx) > Math.abs(dy) + 8) {
          changePanelIndex(listName, dx < 0 ? 1 : -1);
        }
      }, { passive: true });
    }

    function renderSpotLists() {
      const recent = readRecentSpots();
      const named = readNamedLocations();

      savedPanelIndex = named.length ? Math.max(0, Math.min(savedPanelIndex, named.length - 1)) : 0;
      recentPanelIndex = recent.length ? Math.max(0, Math.min(recentPanelIndex, recent.length - 1)) : 0;

      savedCountEl.textContent = `${named.length} / ${MAX_NAMED_LOCATIONS}`;
      savedListEl.textContent = "";
      recentListEl.textContent = "";
      savedDropdownEl.textContent = "";
      recentDropdownEl.textContent = "";

      if (!named.length) {
        const empty = document.createElement("div");
        empty.className = "spot-item";
        empty.innerHTML = `<div class="empty-note">No named locations yet. Save a good spot with a name when you want to keep it.</div>`;
        savedListEl.appendChild(empty);

        const dropEmpty = document.createElement("div");
        dropEmpty.className = "empty-note";
        dropEmpty.textContent = "No named locations yet.";
        savedDropdownEl.appendChild(dropEmpty);
      } else {
        const spot = named[savedPanelIndex];
        const name = spot.name || `Saved place ${savedPanelIndex + 1}`;
        savedListEl.appendChild(createSpotItem(spot, {
          list: "named",
          index: savedPanelIndex,
          name,
          badge: `${savedPanelIndex + 1}/${named.length}`
        }));

        named.forEach((rowSpot, index) => {
          const rowName = rowSpot.name || `Saved place ${index + 1}`;
          savedDropdownEl.appendChild(createDropdownSpotRow(rowSpot, {
            list: "named",
            index,
            name: rowName,
            selected: index === savedPanelIndex
          }));
        });
      }

      if (!recent.length) {
        const empty = document.createElement("div");
        empty.className = "spot-item";
        empty.innerHTML = `<div class="empty-note">Recent parking saves will appear here automatically.</div>`;
        recentListEl.appendChild(empty);

        const dropEmpty = document.createElement("div");
        dropEmpty.className = "empty-note";
        dropEmpty.textContent = "No recent spots yet.";
        recentDropdownEl.appendChild(dropEmpty);
      } else {
        const spot = recent[recentPanelIndex];
        const name = `Recent ${recentPanelIndex + 1} • ${formatDate(spot.savedAtMillis)}`;
        recentListEl.appendChild(createSpotItem(spot, {
          list: "recent",
          index: recentPanelIndex,
          name,
          badge: `${recentPanelIndex + 1}/${recent.length}`
        }));

        recent.forEach((rowSpot, index) => {
          const rowName = `Recent ${index + 1} • ${formatDate(rowSpot.savedAtMillis)}`;
          recentDropdownEl.appendChild(createDropdownSpotRow(rowSpot, {
            list: "recent",
            index,
            name: rowName,
            selected: index === recentPanelIndex
          }));
        });
      }
    }

      return list[Number(index)] || null;

    async function saveSpotWithName(spot) {
      if (!spot) {
        setHeroState("error", "No location to save", "Save a parking spot first.");
        return false;
      }

      const defaultName = `Parking ${new Date(spot.savedAtMillis || Date.now()).toLocaleDateString("en-GB")}`;
      const rawName = window.prompt("Name this location:", spot.name || defaultName);
      if (rawName === null) return false;

      const name = rawName.trim();
      if (!name) {
        setHeroState("error", "Name is empty", "Please give the saved location a name.");
        return false;
      }

      let named = readNamedLocations();
      const normalized = normalizeSpot({
        ...spot,
        id: spot.id || makeSpotId(spot),
        name,
        namedAtMillis: Date.now()
      });

      named = named.filter((item) => item.id !== normalized.id && item.name.toLowerCase() !== name.toLowerCase());

      if (named.length >= MAX_NAMED_LOCATIONS) {
        const replaceOldest = await showConfirmBanner({
          title: "Saved places are full",
          text: "You already have 10 named locations. Replace the oldest one with this new saved place?",
          confirmLabel: "Replace oldest",
          cancelLabel: "Cancel",
          safe: true
        });

        if (!replaceOldest) return false;
        named = named.slice(0, MAX_NAMED_LOCATIONS - 1);
      }

      const next = [normalized, ...named].slice(0, MAX_NAMED_LOCATIONS);
      writeNamedLocations(next);
      renderSpotLists();

      setHeroState(
        "saved",
        "Location saved with name",
        name,
        `Accuracy: ${formatAccuracy(normalized.accuracy)}`
      );

      return true;
    }

    async function handleSpotListClick(event) {
      const button = event.target.closest("button[data-action]");

      if (!button) {
        const row = event.target.closest(".dropdown-spot-row[data-list]");
        if (row) {
          selectPanelIndex(row.dataset.list, row.dataset.index);
        }
        return;
      }

      const spot = getSpotFromList(button.dataset.list, button.dataset.index);
      if (!spot) return;

      if (button.dataset.action === "show") {
        openSpotOnMap(spot, false);
        return;
      }

      if (button.dataset.action === "navigate") {
        openSpotOnMap(spot, true);
        return;
      }

      if (button.dataset.action === "save-name") {
        await saveSpotWithName(spot);
        return;
      }

      if (button.dataset.action === "delete") {
        const ok = await showConfirmBanner({
          title: "Delete saved place?",
          text: `This will remove "${spot.name || "this saved place"}" from your named locations.`,
          confirmLabel: "Delete",
          cancelLabel: "Keep it"
        });

        if (!ok) return;
        const deleteIndex = Number(button.dataset.index);
        const named = readNamedLocations().filter((_, index) => index !== deleteIndex);
        if (savedPanelIndex >= named.length) savedPanelIndex = Math.max(0, named.length - 1);
        writeNamedLocations(named);
        renderSpotLists();
      }
    }

    async function ensureAnonymousLogin() {
      return new Promise((resolve, reject) => {
        const unsubscribe = onAuthStateChanged(auth, async (user) => {
          if (user) {
            currentUser = user;
            unsubscribe();
            resolve(user);
            return;
          }

          try {
            const result = await signInAnonymously(auth);
            currentUser = result.user;
            unsubscribe();
            resolve(result.user);
          } catch (error) {
            unsubscribe();
            reject(error);
          }
        });
      });
    }

    const loginReadyPromise = ensureAnonymousLogin()
      .then((user) => {
        currentUser = user;
        setPill(cloudPillEl, "Cloud: connected", "ok");
        return user;

      .catch((error) => {
        console.error("Cloud login failed. App will continue locally.", error);
        setPill(cloudPillEl, "Cloud: auth failed", "warn");
        return null;
      });

    async function loadCloudSpot() {
      if (!currentUser) return null;

      try {
        const snap = await getDoc(getParkingDocRef(currentUser.uid));

        if (!snap.exists()) {
          setPill(cloudPillEl, "Cloud: empty");
          return null;
        }

        const data = snap.data();

        if (Array.isArray(data.recentSpots)) {
          writeRecentSpots(data.recentSpots);
        }

        if (Array.isArray(data.namedLocations)) {
          writeNamedLocations(data.namedLocations);
        }

        renderSpotLists();

        if (typeof data.lat !== "number" || typeof data.lng !== "number") {
          setPill(cloudPillEl, "Cloud: ready", "ok");
          return null;
        }

        const spot = {
          id: data.id || null,
          lat: data.lat,
          lng: data.lng,
          accuracy: data.accuracy || null,
          source: data.source || "cloud",
          savedAtMillis: data.savedAtMillis || null
        };

        setPill(cloudPillEl, "Cloud: ready", "ok");
        return spot;
      } catch (error) {
        console.error(error);
        setPill(cloudPillEl, "Cloud: unavailable", "warn");
        return null;
      }
    }

    function getCurrentLocationOnce(options = {}) {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Geolocation is not supported on this device/browser."));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => resolve(position),
          (error) => reject(error),
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0,
            ...options
          }
        );
      });
    }

    async function getCachedFallbackLocation() {
      try {
        const position = await getCurrentLocationOnce({
          enableHighAccuracy: false,
          timeout: 4000,
          maximumAge: CACHED_FALLBACK_MAX_AGE_MS
        });
        return position;
      } catch (error) {
        return null;
      }
    }

    async function getHybridBestLocation() {
      vibratePattern("search-start");

      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Geolocation is not supported on this device/browser."));
          return;
        }

        let bestPosition = null;
        let watchId = null;
        let finished = false;
        let lastUiUpdateAt = 0;
        let timeoutId = null;

        const startedAt = Date.now();
        const iosMode = isIOSDevice();
        const liveTimeoutMs = iosMode ? 9500 : LIVE_SEARCH_TIMEOUT_MS;
        const cachedTimeoutMs = iosMode ? 1400 : 900;
        const fastGraceMs = iosMode ? 1800 : FIRST_FAST_FIX_GRACE_MS;
        const fastAccuracyLimit = iosMode ? 75 : FAST_ACCEPTABLE_ACCURACY_METERS;

        function clearGpsWatch() {
          if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
          }

          if (timeoutId !== null) {
            clearTimeout(timeoutId);
            timeoutId = null;
          }
        }

        function finishSuccess(payload) {
          if (finished) return;
          finished = true;
          clearGpsWatch();
          resolve(payload);
        }

        function finishFailure(error) {
          if (finished) return;
          finished = true;
          clearGpsWatch();
          reject(error);
        }

        function maybeUpdateBest(position) {
          const accuracy = position?.coords?.accuracy;
          if (typeof accuracy !== "number") return;

          if (!bestPosition || accuracy < bestPosition.coords.accuracy) {
            bestPosition = position;
          }
        }

        function updateSearchingUi(stageLabel = "Finding location") {
          const now = Date.now();
          if (now - lastUiUpdateAt < LIVE_MIN_UPDATE_INTERVAL_MS) return;

          lastUiUpdateAt = now;

          setHeroState(
            "searching",
            "Saving your parking spot",
            stageLabel,
            bestPosition
              ? `Accuracy: ${Math.round(bestPosition.coords.accuracy)}m`
              : "Getting first GPS fix..."
          );
        }

        function acceptIfGoodEnough(position, source) {
          const accuracy = position.coords.accuracy;
          const elapsed = Date.now() - startedAt;

          if (accuracy <= TARGET_ACCURACY_METERS) {
            finishSuccess({
              position,
              accepted: true,
              source
            });
            return true;
          }

          if (
            elapsed >= fastGraceMs &&
            accuracy <= fastAccuracyLimit
          ) {
            finishSuccess({
              position,
              accepted: true,
              source: `${source}-fast`
            });
            return true;
          }

          return false;
        }

        // 1) Try a fast cached position immediately.
        // This does not block the live GPS watch below.
        navigator.geolocation.getCurrentPosition(
          (position) => {
            maybeUpdateBest(position);
            acceptIfGoodEnough(position, "cached");
          },
          () => {
            // Ignore cached errors. Live GPS is running below.
          },
          {
            enableHighAccuracy: false,
            timeout: cachedTimeoutMs,
            maximumAge: CACHED_FALLBACK_MAX_AGE_MS
          }
        );

        updateSearchingUi("Starting GPS immediately...");

        if (iosMode) {
          // iOS/Safari sometimes resolves watchPosition slowly when opened from NFC.
          // This parallel one-shot often wakes up the location service faster.
          navigator.geolocation.getCurrentPosition(
            (position) => {
              maybeUpdateBest(position);
              acceptIfGoodEnough(position, "ios-one-shot");
            },
            () => {},
            {
              enableHighAccuracy: true,
              maximumAge: 0,
              timeout: liveTimeoutMs
            }
          );
        }

        // 2) Start live GPS immediately. No Firebase, old location, or UI load before this.
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            maybeUpdateBest(position);
            updateSearchingUi("Improving GPS...");

            acceptIfGoodEnough(position, "live");
          },
          (error) => {
            if (bestPosition) {
              finishSuccess({
                position: bestPosition,
                accepted: bestPosition.coords.accuracy <= fastAccuracyLimit,
                source: "best-available-after-error",
                error
              });
              return;
            }

            finishFailure(new Error("Could not get a usable location."));
          },
          {
            enableHighAccuracy: true,
            maximumAge: 15000,
            timeout: liveTimeoutMs
          }
        );

        timeoutId = setTimeout(() => {
          if (bestPosition) {
            finishSuccess({
              position: bestPosition,
              accepted: bestPosition.coords.accuracy <= fastAccuracyLimit,
              source: "timeout-best"
            });
            return;
          }

          finishFailure(new Error("Could not get a usable location."));
        }, liveTimeoutMs);
      });
    }

    async function persistSpot(spot, cloudFailureTitle = "Saved locally") {
      // First save locally, immediately.
      const normalizedSpot = normalizeSpot(spot);
      saveLocalBackup(normalizedSpot);
      const recentSpots = addRecentSpot(normalizedSpot);
      lastKnownSpot = normalizedSpot;
      updateHeroFromSpot(normalizedSpot);
      vibratePattern("success");

      // Cloud sync runs in the background.
      // It must never block the NFC save flow.
      (async () => {
        try {
          let user = currentUser;

          if (!user && loginReadyPromise) {
            user = await loginReadyPromise;
          }

          if (!user) {
            setPill(cloudPillEl, "Cloud: offline", "warn");
            return;
          }

          await setDoc(getParkingDocRef(user.uid), {
            ...normalizedSpot,
            recentSpots,
            namedLocations: readNamedLocations(),
            savedAt: serverTimestamp()
          });

          setPill(cloudPillEl, "Cloud: synced", "ok");
        } catch (cloudError) {
          console.error("Cloud sync failed:", cloudError);
          setPill(cloudPillEl, "Cloud: pending/failed", "warn");

          setHeroState(
            "saved",
            cloudFailureTitle,
            "",
            `Saved: ${formatDate(normalizedSpot.savedAtMillis)} • Accuracy: ${Math.round(normalizedSpot.accuracy || 0)}m`
          );
        }
      })();

      return true;
    }

    async function saveParkingLocation() {
      hideSaveAnyway();
      setBusy(true);

      try {
        // VERY IMPORTANT:
        // GPS starts here immediately. Do not put cloud login, old location load,
        // or any other await before this line.
        const locationPromise = getHybridBestLocation();

        setPill(modePillEl, "Mode: saving", "warn");
        setHeroState(
          "searching",
          "Saving your parking spot",
          "GPS started immediately...",
          "Do not close this page."
        );

        const result = await locationPromise;
        const position = result.position;
        const measuredAccuracy = position.coords.accuracy;

        const spot = {
          lat: position.coords.latitude,
          lng: position.coords.longitude,
          accuracy: measuredAccuracy,
          source: result.source || "gps",
          savedAtMillis: Date.now()
        };
        spot.id = makeSpotId(spot);

        if (!result.accepted) {
          bestFailedSpot = spot;
          setPill(localPillEl, `Best found: ${Math.round(measuredAccuracy || 0)}m`, "warn");
          setHeroState(
            "error",
            "Accuracy not good enough",
            `Best result: ${Math.round(measuredAccuracy || 0)}m`,
            result.source && result.source.includes("cached")
              ? `Using cached location fallback • Required: ${FAST_ACCEPTABLE_ACCURACY_METERS}m or better`
              : `Required: ${FAST_ACCEPTABLE_ACCURACY_METERS}m or better`
          );
          showSaveAnyway();
          vibratePattern("error");
          return false;
        }

        return await persistSpot(spot);
      } catch (error) {
        console.error(error);

        if (error.code === 1) {
          setHeroState("error", "Location permission denied", "");
        } else if (error.code === 2) {
          setHeroState("error", "Location unavailable", "");
        } else if (error.code === 3) {
          setHeroState("error", "Location request timed out", "");
        } else {
          setHeroState("error", "Could not get location", "");
        }

        vibratePattern("error");
        return false;
      } finally {
        setBusy(false);
      }
    }

    function getBestAvailableSpot() {
      if (lastKnownSpot) return { spot: lastKnownSpot };

      const localSpot = readLocalBackup();
      if (localSpot) return { spot: localSpot };

      return { spot: null };
    }

    async function showSavedLocation() {
      hideSaveAnyway();
      setBusy(true);
      setHeroState("waiting", "Opening saved spot", "");

      try {
        let cloudSpot = null;

        if (currentUser) {
          cloudSpot = await loadCloudSpot();
        }

        const chosen = cloudSpot ? { spot: cloudSpot } : getBestAvailableSpot();

        if (!chosen.spot) {
          setHeroState("error", "No saved location found", "");
          return;
        }

        lastKnownSpot = chosen.spot;
        updateHeroFromSpot(chosen.spot);

        const mapsUrl = buildShowMapUrl(chosen.spot.lat, chosen.spot.lng);
        openMapUrl(mapsUrl);
      } finally {
        setBusy(false);
      }
    }

    async function navigateToSavedLocation() {
      hideSaveAnyway();
      setBusy(true);
      setHeroState("waiting", "Preparing navigation", "");

      try {
        let cloudSpot = null;

        if (currentUser) {
          cloudSpot = await loadCloudSpot();
        }

        const chosen = cloudSpot ? { spot: cloudSpot } : getBestAvailableSpot();

        if (!chosen.spot) {
          setHeroState("error", "No saved location found", "");
          return;
        }

        lastKnownSpot = chosen.spot;
        updateHeroFromSpot(chosen.spot);

        const mapsUrl = buildNavigateMapUrl(chosen.spot.lat, chosen.spot.lng);
        openMapUrl(mapsUrl);
      } finally {
        setBusy(false);
      }
    }

    async function clearSavedLocation() {
      hideSaveAnyway();

      const confirmed = await showConfirmBanner({
        title: "Clear current parking spot?",
        text: "This will remove only the current saved parking spot. Your recent history and named saved places will stay available.",
        confirmLabel: "Yes, clear it",
        cancelLabel: "Cancel"
      });

      if (!confirmed) return;

      setBusy(true);
      setHeroState("waiting", "Clearing current spot", "");

      try {
        clearLocalBackup();
        sessionStorage.removeItem(SESSION_SAVE_KEY);
        lastKnownSpot = null;

        if (currentUser) {
          try {
            await deleteDoc(getParkingDocRef(currentUser.uid));
            setPill(cloudPillEl, "Cloud: empty");
          } catch (error) {
            console.error(error);
            setPill(cloudPillEl, "Cloud: delete failed", "warn");
          }
        }

        setHeroState("waiting", "Current spot cleared", "Recent and named locations are still saved.");
      } finally {
        setBusy(false);
      }
    }

    async function saveBestFoundAnyway() {
      if (!bestFailedSpot) return;

      hideSaveAnyway();
      setBusy(true);

      try {
        await persistSpot(bestFailedSpot, "Saved locally");
        sessionStorage.setItem(SESSION_SAVE_KEY, "true");
        clearSaveModeFromUrl();
        setPill(modePillEl, "Mode: view only");
      } finally {
        setBusy(false);
      }
    }

    function cancelSaveAnyway() {
      hideSaveAnyway();
      setHeroState("waiting", "Save cancelled", "");
      clearSaveModeFromUrl();
      setPill(modePillEl, "Mode: view only");
    }

    async function saveCurrentSpotWithName() {
      const chosen = lastKnownSpot || readLocalBackup();
      await saveSpotWithName(chosen);
    }

    showBtn.addEventListener("click", showSavedLocation);
    navigateBtn.addEventListener("click", navigateToSavedLocation);
    saveNamedBtn.addEventListener("click", saveCurrentSpotWithName);
    clearBtn.addEventListener("click", clearSavedLocation);
    cancelSaveBtn.addEventListener("click", cancelSaveAnyway);
    saveAnywayBtn.addEventListener("click", saveBestFoundAnyway);
    recentListEl.addEventListener("click", handleSpotListClick);
    savedListEl.addEventListener("click", handleSpotListClick);
    recentDropdownEl.addEventListener("click", handleSpotListClick);
    savedDropdownEl.addEventListener("click", handleSpotListClick);
    recentToggleBtn.addEventListener("click", () => togglePanelDropdown(recentPanelEl, recentDropdownEl));
    savedToggleBtn.addEventListener("click", () => togglePanelDropdown(savedPanelEl, savedDropdownEl));
    bindPanelHeaderToggle(recentPanelEl, recentDropdownEl);
    bindPanelHeaderToggle(savedPanelEl, savedDropdownEl);
    enableCarouselSwipe(recentListEl, "recent");
    enableCarouselSwipe(savedListEl, "named");

    async function init() {
      renderSpotLists();
      setBusy(true);

      if (currentMode === "save") {
        setPill(modePillEl, "Mode: NFC save", "ok");
        setPill(localPillEl, "Local backup: skipped during save", "warn");

        setHeroState(
          "searching",
          "Saving your parking spot",
          "Starting GPS immediately...",
          "Previous location will not be loaded during NFC save."
        );

        // NFC flow:
        // Start GPS/save first. Do not load old location. Do not wait for Firebase.
        const savedSuccessfully = await saveParkingLocation();

        if (savedSuccessfully) {
          sessionStorage.setItem(SESSION_SAVE_KEY, "true");
          clearSaveModeFromUrl();
          setPill(modePillEl, "Mode: view only");
        }

        return;
      }

      setPill(modePillEl, "Mode: view only");

      const localSpot = readLocalBackup();
      if (localSpot) {
        lastKnownSpot = localSpot;
        updateHeroFromSpot(localSpot);
      } else {
        setHeroState("waiting", "No saved location", "");
      }

      try {
        const user = await loginReadyPromise;

        if (user) {
          const cloudSpot = await loadCloudSpot();

          if (cloudSpot) {
            lastKnownSpot = cloudSpot;
            saveLocalBackup(cloudSpot);
            updateHeroFromSpot(cloudSpot);
          }
        }
      } catch (error) {
        console.error(error);
      } finally {
        setBusy(false);
      }
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          await navigator.serviceWorker.register("./sw.js");
        } catch (error) {
          console.error("Service worker registration failed:", error);
        }
      });
    }

    init();
  </script>
</body>
</html>
