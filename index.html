<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Save Parking Spot</title>

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preload" as="image" href="./phivimakes-logo-256.webp" />
  <meta name="theme-color" content="#0a0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Parking Spot" />

  <style>
    :root {
      --bg-1: #07090d;
      --bg-2: #10141d;
      --bg-3: #171c27;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.15);
      --text: #ffffff;
      --muted: #aeb6c7;
      --accent: #ffd84d;
      --success-soft: rgba(53, 208, 127, 0.16);
      --danger-soft: rgba(255, 109, 109, 0.15);
      --search-soft: rgba(77, 144, 254, 0.18);
      --shadow-xl: 0 24px 60px rgba(0, 0, 0, 0.42);
      --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.34);
      --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.26);
      --radius-xl: 30px;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top center, rgba(255, 216, 77, 0.16), transparent 18%),
        radial-gradient(circle at bottom left, rgba(94, 160, 255, 0.10), transparent 24%),
        linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 40%, var(--bg-1) 100%);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .app {
      width: min(100%, 430px);
      height: calc(100dvh - 20px);
      max-height: calc(100dvh - 20px);
      border-radius: var(--radius-xl);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.022));
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: var(--shadow-xl);
      backdrop-filter: blur(16px);
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.06), transparent 22%),
        linear-gradient(315deg, rgba(255,216,77,0.05), transparent 24%);
      pointer-events: none;
    }

    .top {
      position: relative;
      padding: 18px 18px 12px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
    }

    .title {
      margin: 0;
      font-size: clamp(1.28rem, 4.7vw, 1.58rem);
      font-weight: 900;
      letter-spacing: 0.28px;
      color: var(--accent);
      text-shadow:
        0 0 18px rgba(255, 216, 77, 0.14),
        0 0 36px rgba(255, 216, 77, 0.05);
    }

    .content {
      position: relative;
      padding: 12px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }

    .hero {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(31, 36, 50, 0.96), rgba(18, 22, 31, 0.99));
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 16px 14px 14px;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent 28%);
      pointer-events: none;
    }

    .hero-icon-wrap {
      position: relative;
      width: 82px;
      height: 82px;
      margin: 0 auto 12px;
    }

    .hero-icon {
      position: relative;
      z-index: 2;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.85rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line-strong);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 6px 18px rgba(0,0,0,0.18);
      transition: all 0.28s ease;
    }

    .brand-logo {
      width: 78%;
      height: 78%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 0 18px rgba(34, 211, 238, 0.75));
      animation: logoPulse 2.4s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.55));
      }

      50% {
        transform: scale(1.06);
        filter: drop-shadow(0 0 26px rgba(56, 189, 248, 0.95));
      }
    }

    .hero.saved .hero-icon {
      background: var(--success-soft);
      border-color: rgba(53, 208, 127, 0.35);
      box-shadow:
        0 0 0 8px rgba(53, 208, 127, 0.06),
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 10px 24px rgba(0,0,0,0.20);
      transform: scale(1.03);
    }

    .hero.waiting .hero-icon {
      background: rgba(255, 216, 77, 0.10);
      border-color: rgba(255, 216, 77, 0.24);
      box-shadow:
        0 0 0 8px rgba(255, 216, 77, 0.04),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .hero.searching .hero-icon {
      background: var(--search-soft);
      border-color: rgba(77, 144, 254, 0.35);
      box-shadow:
        0 0 0 8px rgba(77, 144, 254, 0.05),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .hero.error .hero-icon {
      background: var(--danger-soft);
      border-color: rgba(255, 109, 109, 0.28);
      box-shadow:
        0 0 0 8px rgba(255, 109, 109, 0.04),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .radar-ring,
    .radar-ring-2 {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(77, 144, 254, 0.35);
      opacity: 0;
      transform: scale(0.7);
      pointer-events: none;
      display: none;
    }

    .hero.searching .radar-ring,
    .hero.searching .radar-ring-2 {
      display: block;
    }

    .hero.searching .radar-ring {
      animation: radarPulse 1.8s infinite;
    }

    .hero.searching .radar-ring-2 {
      animation: radarPulse 1.8s infinite 0.9s;
    }

    @keyframes radarPulse {
      0% { transform: scale(0.72); opacity: 0.82; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .hero-title {
      font-size: clamp(1rem, 4vw, 1.14rem);
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    .hero-text {
      color: #eef2f8;
      line-height: 1.4;
      min-height: 20px;
      font-size: 0.93rem;
      padding: 0 2px;
    }

    .hero-meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.79rem;
      line-height: 1.35;
      word-break: break-word;
      min-height: 16px;
      padding: 0 2px;
    }

    .action-row {
      display: none;
      gap: 8px;
      margin-top: 12px;
    }

    .action-row.show {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .mini-btn {
      min-height: 44px;
      border-radius: 14px;
      border: none;
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: linear-gradient(180deg, #6ba8ff, #447fea);
      box-shadow: var(--shadow-md);
      font-size: 0.92rem;
    }

    .mini-btn.cancel {
      background: linear-gradient(180deg, #6f737c, #4f545d);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 1px;
      align-content: start;
    }

    .pill {
      padding: 8px 11px;
      border-radius: 999px;
      font-size: 0.74rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      color: #eff3fa;
      backdrop-filter: blur(6px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      white-space: nowrap;
    }

    .pill.ok {
      color: #d3ffe4;
      border-color: rgba(53, 208, 127, 0.18);
    }

    .pill.warn {
      color: #ffe9b3;
      border-color: rgba(255, 204, 102, 0.18);
    }

    .buttons {
      display: grid;
      grid-template-rows: repeat(3, auto);
      gap: 10px;
      align-content: end;
      min-height: 0;
    }

    button {
      appearance: none;
      border: none;
      width: 100%;
      min-height: 54px;
      border-radius: var(--radius-md);
      cursor: pointer;
      padding: 14px 16px;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.2px;
      color: white;
      transition: transform 0.12s ease, opacity 0.18s ease, filter 0.18s ease;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.14), transparent 34%);
      pointer-events: none;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.58;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .show-btn {
      background: linear-gradient(180deg, #6fb0ff, #447fea);
    }

    .nav-btn {
      background: linear-gradient(180deg, #4ea6ff, #297ae7);
    }

    .clear-btn {
      background: linear-gradient(180deg, #ff7d7d, #e25656);
    }

    @media (display-mode: browser) {
      body {
        padding: 12px;
      }

      .app {
        width: min(100%, 440px);
        height: calc(100svh - 24px);
        max-height: calc(100svh - 24px);
      }
    }

    @media (display-mode: standalone) {
      body {
        padding: 8px;
      }

      .app {
        width: 100%;
        height: calc(100dvh - 16px);
        max-height: calc(100dvh - 16px);
      }
    }

    @media (max-width: 370px) {
      .app {
        width: 100%;
        height: calc(100dvh - 16px);
      }

      .top {
        padding: 16px 14px 10px;
      }

      .title {
        font-size: 1.28rem;
      }

      .content {
        padding: 10px;
        gap: 8px;
      }

      .hero {
        padding: 14px 12px 12px;
      }

      .hero-icon-wrap {
        width: 72px;
        height: 72px;
        margin-bottom: 10px;
      }

      .hero-icon {
        width: 72px;
        height: 72px;
        font-size: 1.65rem;
      }

      .pill {
        font-size: 0.7rem;
        padding: 7px 10px;
      }

      button {
        min-height: 50px;
        font-size: 0.9rem;
      }

      .mini-btn {
        min-height: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <h1 class="title">Save Parking Spot</h1>
    </div>

    <div class="content">
      <div id="hero" class="hero waiting">
        <div class="hero-icon-wrap">
          <div class="radar-ring"></div>
          <div class="radar-ring-2"></div>
          <div id="heroIcon" class="hero-icon">
            <img
              src="./phivimakes-logo-256.webp"
              class="brand-logo"
              alt="phivimakes logo"
              fetchpriority="high"
              decoding="async"
            />
          </div>
        </div>

        <div id="heroTitle" class="hero-title">Starting...</div>
        <div id="heroText" class="hero-text">Preparing secure storage.</div>
        <div id="heroMeta" class="hero-meta"></div>

        <div id="saveAnywayRow" class="action-row">
          <button class="mini-btn cancel" id="cancelSaveBtn">Cancel</button>
          <button class="mini-btn" id="saveAnywayBtn">Save Anyway</button>
        </div>
      </div>

      <div class="pill-row">
        <div id="cloudPill" class="pill">Cloud: checking...</div>
        <div id="localPill" class="pill">Local backup: checking...</div>
        <div id="modePill" class="pill">Mode: checking...</div>
      </div>

      <div class="buttons">
        <button class="show-btn" id="showBtn">
          🗺️ Show on Maps
        </button>

        <button class="nav-btn" id="navigateBtn">
          🧭 Navigate to Spot
        </button>

        <button class="clear-btn" id="clearBtn">
          🗑️ Clear Saved Data
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import {
      initializeFirestore,
      persistentLocalCache,
      persistentSingleTabManager,
      doc,
      setDoc,
      getDoc,
      deleteDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBJOuWflHjO3_b-VTerQrhrleIVBz50GGg",
      authDomain: "mini-cooper-routine.firebaseapp.com",
      projectId: "mini-cooper-routine",
      storageBucket: "mini-cooper-routine.firebasestorage.app",
      messagingSenderId: "734879685589",
      appId: "1:734879685589:web:a9a7f1b776efce00e43b5c",
      measurementId: "G-1LETT1WZQ6"
    };

    const LOCAL_KEY = "saveParkingSpotLocalBackupV6";
    const SESSION_SAVE_KEY = "parkingSavedThisSession";

    const TARGET_ACCURACY_METERS = 30;
    const FAST_ACCEPTABLE_ACCURACY_METERS = 60;

    const LIVE_SEARCH_TIMEOUT_MS = 6500;
    const FIRST_FAST_FIX_GRACE_MS = 1200;
    const LIVE_MIN_UPDATE_INTERVAL_MS = 700;
    const CACHED_FALLBACK_MAX_AGE_MS = 60 * 1000;

    const app = initializeApp(firebaseConfig);

    let db;
    try {
      db = initializeFirestore(app, {
        localCache: persistentLocalCache({
          tabManager: persistentSingleTabManager()
        })
      });
    } catch (error) {
      console.warn("Persistent Firestore cache is unavailable. Falling back to memory.", error);
      db = initializeFirestore(app);
    }

    const auth = getAuth(app);

    const heroEl = document.getElementById("hero");
    const heroIconEl = document.getElementById("heroIcon");
    const heroTitleEl = document.getElementById("heroTitle");
    const heroTextEl = document.getElementById("heroText");
    const heroMetaEl = document.getElementById("heroMeta");

    const cloudPillEl = document.getElementById("cloudPill");
    const localPillEl = document.getElementById("localPill");
    const modePillEl = document.getElementById("modePill");

    const showBtn = document.getElementById("showBtn");
    const navigateBtn = document.getElementById("navigateBtn");
    const clearBtn = document.getElementById("clearBtn");
    const saveAnywayRow = document.getElementById("saveAnywayRow");
    const cancelSaveBtn = document.getElementById("cancelSaveBtn");
    const saveAnywayBtn = document.getElementById("saveAnywayBtn");

    let currentUser = null;
    let lastKnownSpot = null;
    let bestFailedSpot = null;

    const params = new URLSearchParams(window.location.search);

    function isNfcSaveMode() {
      return (
        params.get("mode") === "save" ||
        params.get("action") === "save" ||
        params.get("save") === "1"
      );
    }

    const currentMode = isNfcSaveMode() ? "save" : "view";

    function isIOSDevice() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    function openMapUrl(url) {
      window.location.href = url;
    }

    function buildShowMapUrl(lat, lng) {
      if (isIOSDevice()) {
        return `https://maps.apple.com/?ll=${lat},${lng}&q=Saved%20Parking%20Spot`;
      }
      return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
    }

    function buildNavigateMapUrl(lat, lng) {
      if (isIOSDevice()) {
        return `https://maps.apple.com/?daddr=${lat},${lng}&dirflg=w`;
      }
      return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking&dir_action=navigate`;
    }

    function setBusy(isBusy) {
      showBtn.disabled = isBusy;
      navigateBtn.disabled = isBusy;
      clearBtn.disabled = isBusy;
      cancelSaveBtn.disabled = isBusy;
      saveAnywayBtn.disabled = isBusy;
    }

    function vibratePattern(type) {
      if (!navigator.vibrate) return;
      if (type === "search-start") navigator.vibrate([30]);
      if (type === "success") navigator.vibrate([70, 35, 90]);
      if (type === "error") navigator.vibrate([110, 45, 110]);
    }

    function setPill(el, text, type = "") {
      el.textContent = text;
      el.className = `pill ${type}`.trim();
    }

    function formatDate(ms) {
      if (!ms) return "";
      return new Date(ms).toLocaleString("en-GB");
    }

    function getParkingDocRef(uid) {
      return doc(db, "users", uid, "parking", "current");
    }

    function clearSaveModeFromUrl() {
      const cleanUrl = window.location.pathname + window.location.hash;
      window.history.replaceState({}, document.title, cleanUrl);
    }

    function hideSaveAnyway() {
      saveAnywayRow.classList.remove("show");
      bestFailedSpot = null;
    }

    function showSaveAnyway() {
      saveAnywayRow.classList.add("show");
    }

    function setHeroState(type, title, text = "", meta = "") {
      heroEl.className = `hero ${type}`;
      heroTitleEl.textContent = title;
      heroTextEl.textContent = text;
      heroMetaEl.textContent = meta;

      // Do not change heroIconEl.textContent here.
      // The logo is permanent inside #heroIcon, and changing textContent would delete it.
    }

    function saveLocalBackup(data) {
      try {
        localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
        setPill(localPillEl, "Local backup: ready", "ok");
      } catch (error) {
        console.error(error);
        setPill(localPillEl, "Local backup: unavailable", "warn");
      }
    }

    function readLocalBackup() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        if (!raw) {
          setPill(localPillEl, "Local backup: empty");
          return null;
        }
        const parsed = JSON.parse(raw);
        setPill(localPillEl, "Local backup: ready", "ok");
        return parsed;
      } catch (error) {
        console.error(error);
        setPill(localPillEl, "Local backup: error", "warn");
        return null;
      }
    }

    function clearLocalBackup() {
      try {
        localStorage.removeItem(LOCAL_KEY);
      } catch (error) {
        console.error(error);
      }
      setPill(localPillEl, "Local backup: empty");
    }

    function updateHeroFromSpot(spot) {
      if (!spot) {
        setHeroState("waiting", "No saved location", "");
        return;
      }

      hideSaveAnyway();
      setHeroState(
        "saved",
        "Parking spot saved successfully",
        "",
        `Saved: ${formatDate(spot.savedAtMillis)} • Accuracy: ${spot.accuracy ? Math.round(spot.accuracy) + "m" : "unknown"}`
      );
    }

    async function ensureAnonymousLogin() {
      return new Promise((resolve, reject) => {
        const unsubscribe = onAuthStateChanged(auth, async (user) => {
          if (user) {
            currentUser = user;
            unsubscribe();
            resolve(user);
            return;
          }

          try {
            const result = await signInAnonymously(auth);
            currentUser = result.user;
            unsubscribe();
            resolve(result.user);
          } catch (error) {
            unsubscribe();
            reject(error);
          }
        });
      });
    }

    const loginReadyPromise = ensureAnonymousLogin()
      .then((user) => {
        currentUser = user;
        setPill(cloudPillEl, "Cloud: connected", "ok");
        return user;
      })
      .catch((error) => {
        console.error("Cloud login failed. App will continue locally.", error);
        setPill(cloudPillEl, "Cloud: auth failed", "warn");
        return null;
      });

    async function loadCloudSpot() {
      if (!currentUser) return null;

      try {
        const snap = await getDoc(getParkingDocRef(currentUser.uid));

        if (!snap.exists()) {
          setPill(cloudPillEl, "Cloud: empty");
          return null;
        }

        const data = snap.data();
        const spot = {
          lat: data.lat,
          lng: data.lng,
          accuracy: data.accuracy || null,
          savedAtMillis: data.savedAtMillis || null
        };

        setPill(cloudPillEl, "Cloud: ready", "ok");
        return spot;
      } catch (error) {
        console.error(error);
        setPill(cloudPillEl, "Cloud: unavailable", "warn");
        return null;
      }
    }

    function getCurrentLocationOnce(options = {}) {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Geolocation is not supported on this device/browser."));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => resolve(position),
          (error) => reject(error),
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0,
            ...options
          }
        );
      });
    }

    async function getCachedFallbackLocation() {
      try {
        const position = await getCurrentLocationOnce({
          enableHighAccuracy: false,
          timeout: 4000,
          maximumAge: CACHED_FALLBACK_MAX_AGE_MS
        });
        return position;
      } catch (error) {
        return null;
      }
    }

    async function getHybridBestLocation() {
      vibratePattern("search-start");

      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Geolocation is not supported on this device/browser."));
          return;
        }

        let bestPosition = null;
        let watchId = null;
        let finished = false;
        let lastUiUpdateAt = 0;
        let timeoutId = null;

        const startedAt = Date.now();

        function clearGpsWatch() {
          if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
          }

          if (timeoutId !== null) {
            clearTimeout(timeoutId);
            timeoutId = null;
          }
        }

        function finishSuccess(payload) {
          if (finished) return;
          finished = true;
          clearGpsWatch();
          resolve(payload);
        }

        function finishFailure(error) {
          if (finished) return;
          finished = true;
          clearGpsWatch();
          reject(error);
        }

        function maybeUpdateBest(position) {
          const accuracy = position?.coords?.accuracy;
          if (typeof accuracy !== "number") return;

          if (!bestPosition || accuracy < bestPosition.coords.accuracy) {
            bestPosition = position;
          }
        }

        function updateSearchingUi(stageLabel = "Finding location") {
          const now = Date.now();
          if (now - lastUiUpdateAt < LIVE_MIN_UPDATE_INTERVAL_MS) return;

          lastUiUpdateAt = now;

          setHeroState(
            "searching",
            "Saving your parking spot",
            stageLabel,
            bestPosition
              ? `Accuracy: ${Math.round(bestPosition.coords.accuracy)}m`
              : "Getting first GPS fix..."
          );
        }

        function acceptIfGoodEnough(position, source) {
          const accuracy = position.coords.accuracy;
          const elapsed = Date.now() - startedAt;

          if (accuracy <= TARGET_ACCURACY_METERS) {
            finishSuccess({
              position,
              accepted: true,
              source
            });
            return true;
          }

          if (
            elapsed >= FIRST_FAST_FIX_GRACE_MS &&
            accuracy <= FAST_ACCEPTABLE_ACCURACY_METERS
          ) {
            finishSuccess({
              position,
              accepted: true,
              source: `${source}-fast`
            });
            return true;
          }

          return false;
        }

        // 1) Try a fast cached position immediately.
        // This does not block the live GPS watch below.
        navigator.geolocation.getCurrentPosition(
          (position) => {
            maybeUpdateBest(position);
            acceptIfGoodEnough(position, "cached");
          },
          () => {
            // Ignore cached errors. Live GPS is running below.
          },
          {
            enableHighAccuracy: false,
            timeout: 900,
            maximumAge: CACHED_FALLBACK_MAX_AGE_MS
          }
        );

        updateSearchingUi("Starting GPS immediately...");

        // 2) Start live GPS immediately. No Firebase, old location, or UI load before this.
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            maybeUpdateBest(position);
            updateSearchingUi("Improving GPS...");

            acceptIfGoodEnough(position, "live");
          },
          (error) => {
            if (bestPosition) {
              finishSuccess({
                position: bestPosition,
                accepted: bestPosition.coords.accuracy <= FAST_ACCEPTABLE_ACCURACY_METERS,
                source: "best-available-after-error",
                error
              });
              return;
            }

            finishFailure(new Error("Could not get a usable location."));
          },
          {
            enableHighAccuracy: true,
            maximumAge: 15000,
            timeout: LIVE_SEARCH_TIMEOUT_MS
          }
        );

        timeoutId = setTimeout(() => {
          if (bestPosition) {
            finishSuccess({
              position: bestPosition,
              accepted: bestPosition.coords.accuracy <= FAST_ACCEPTABLE_ACCURACY_METERS,
              source: "timeout-best"
            });
            return;
          }

          finishFailure(new Error("Could not get a usable location."));
        }, LIVE_SEARCH_TIMEOUT_MS);
      });
    }

    async function persistSpot(spot, cloudFailureTitle = "Saved locally") {
      // First save locally, immediately.
      saveLocalBackup(spot);
      lastKnownSpot = spot;
      updateHeroFromSpot(spot);
      vibratePattern("success");

      // Cloud sync runs in the background.
      // It must never block the NFC save flow.
      (async () => {
        try {
          let user = currentUser;

          if (!user && loginReadyPromise) {
            user = await loginReadyPromise;
          }

          if (!user) {
            setPill(cloudPillEl, "Cloud: offline", "warn");
            return;
          }

          await setDoc(getParkingDocRef(user.uid), {
            ...spot,
            savedAt: serverTimestamp()
          });

          setPill(cloudPillEl, "Cloud: synced", "ok");
        } catch (cloudError) {
          console.error("Cloud sync failed:", cloudError);
          setPill(cloudPillEl, "Cloud: pending/failed", "warn");

          setHeroState(
            "saved",
            cloudFailureTitle,
            "",
            `Saved: ${formatDate(spot.savedAtMillis)} • Accuracy: ${Math.round(spot.accuracy || 0)}m`
          );
        }
      })();

      return true;
    }

    async function saveParkingLocation() {
      hideSaveAnyway();
      setBusy(true);

      try {
        // VERY IMPORTANT:
        // GPS starts here immediately. Do not put cloud login, old location load,
        // or any other await before this line.
        const locationPromise = getHybridBestLocation();

        setPill(modePillEl, "Mode: saving", "warn");
        setHeroState(
          "searching",
          "Saving your parking spot",
          "GPS started immediately...",
          "Do not close this page."
        );

        const result = await locationPromise;
        const position = result.position;
        const measuredAccuracy = position.coords.accuracy;

        const spot = {
          lat: position.coords.latitude,
          lng: position.coords.longitude,
          accuracy: measuredAccuracy,
          source: result.source || "gps",
          savedAtMillis: Date.now()
        };

        if (!result.accepted) {
          bestFailedSpot = spot;
          setPill(localPillEl, `Best found: ${Math.round(measuredAccuracy || 0)}m`, "warn");
          setHeroState(
            "error",
            "Accuracy not good enough",
            `Best result: ${Math.round(measuredAccuracy || 0)}m`,
            result.source && result.source.includes("cached")
              ? `Using cached location fallback • Required: ${FAST_ACCEPTABLE_ACCURACY_METERS}m or better`
              : `Required: ${FAST_ACCEPTABLE_ACCURACY_METERS}m or better`
          );
          showSaveAnyway();
          vibratePattern("error");
          return false;
        }

        return await persistSpot(spot);
      } catch (error) {
        console.error(error);

        if (error.code === 1) {
          setHeroState("error", "Location permission denied", "");
        } else if (error.code === 2) {
          setHeroState("error", "Location unavailable", "");
        } else if (error.code === 3) {
          setHeroState("error", "Location request timed out", "");
        } else {
          setHeroState("error", "Could not get location", "");
        }

        vibratePattern("error");
        return false;
      } finally {
        setBusy(false);
      }
    }

    function getBestAvailableSpot() {
      if (lastKnownSpot) return { spot: lastKnownSpot };

      const localSpot = readLocalBackup();
      if (localSpot) return { spot: localSpot };

      return { spot: null };
    }

    async function showSavedLocation() {
      hideSaveAnyway();
      setBusy(true);
      setHeroState("waiting", "Opening saved spot", "");

      try {
        let cloudSpot = null;

        if (currentUser) {
          cloudSpot = await loadCloudSpot();
        }

        const chosen = cloudSpot ? { spot: cloudSpot } : getBestAvailableSpot();

        if (!chosen.spot) {
          setHeroState("error", "No saved location found", "");
          return;
        }

        lastKnownSpot = chosen.spot;
        updateHeroFromSpot(chosen.spot);

        const mapsUrl = buildShowMapUrl(chosen.spot.lat, chosen.spot.lng);
        openMapUrl(mapsUrl);
      } finally {
        setBusy(false);
      }
    }

    async function navigateToSavedLocation() {
      hideSaveAnyway();
      setBusy(true);
      setHeroState("waiting", "Preparing navigation", "");

      try {
        let cloudSpot = null;

        if (currentUser) {
          cloudSpot = await loadCloudSpot();
        }

        const chosen = cloudSpot ? { spot: cloudSpot } : getBestAvailableSpot();

        if (!chosen.spot) {
          setHeroState("error", "No saved location found", "");
          return;
        }

        lastKnownSpot = chosen.spot;
        updateHeroFromSpot(chosen.spot);

        const mapsUrl = buildNavigateMapUrl(chosen.spot.lat, chosen.spot.lng);
        openMapUrl(mapsUrl);
      } finally {
        setBusy(false);
      }
    }

    async function clearSavedLocation() {
      hideSaveAnyway();
      setBusy(true);
      setHeroState("waiting", "Clearing saved data", "");

      try {
        clearLocalBackup();
        sessionStorage.removeItem(SESSION_SAVE_KEY);
        lastKnownSpot = null;

        if (currentUser) {
          try {
            await deleteDoc(getParkingDocRef(currentUser.uid));
            setPill(cloudPillEl, "Cloud: empty");
          } catch (error) {
            console.error(error);
            setPill(cloudPillEl, "Cloud: delete failed", "warn");
          }
        }

        setHeroState("waiting", "Saved data cleared", "");
      } finally {
        setBusy(false);
      }
    }

    async function saveBestFoundAnyway() {
      if (!bestFailedSpot) return;

      hideSaveAnyway();
      setBusy(true);

      try {
        await persistSpot(bestFailedSpot, "Saved locally");
        sessionStorage.setItem(SESSION_SAVE_KEY, "true");
        clearSaveModeFromUrl();
        setPill(modePillEl, "Mode: view only");
      } finally {
        setBusy(false);
      }
    }

    function cancelSaveAnyway() {
      hideSaveAnyway();
      setHeroState("waiting", "Save cancelled", "");
      clearSaveModeFromUrl();
      setPill(modePillEl, "Mode: view only");
    }

    showBtn.addEventListener("click", showSavedLocation);
    navigateBtn.addEventListener("click", navigateToSavedLocation);
    clearBtn.addEventListener("click", clearSavedLocation);
    cancelSaveBtn.addEventListener("click", cancelSaveAnyway);
    saveAnywayBtn.addEventListener("click", saveBestFoundAnyway);

    async function init() {
      setBusy(true);

      if (currentMode === "save") {
        setPill(modePillEl, "Mode: NFC save", "ok");
        setPill(localPillEl, "Local backup: skipped during save", "warn");

        setHeroState(
          "searching",
          "Saving your parking spot",
          "Starting GPS immediately...",
          "Previous location will not be loaded during NFC save."
        );

        // NFC flow:
        // Start GPS/save first. Do not load old location. Do not wait for Firebase.
        const savedSuccessfully = await saveParkingLocation();

        if (savedSuccessfully) {
          sessionStorage.setItem(SESSION_SAVE_KEY, "true");
          clearSaveModeFromUrl();
          setPill(modePillEl, "Mode: view only");
        }

        return;
      }

      setPill(modePillEl, "Mode: view only");

      const localSpot = readLocalBackup();
      if (localSpot) {
        lastKnownSpot = localSpot;
        updateHeroFromSpot(localSpot);
      } else {
        setHeroState("waiting", "No saved location", "");
      }

      try {
        const user = await loginReadyPromise;

        if (user) {
          const cloudSpot = await loadCloudSpot();

          if (cloudSpot) {
            lastKnownSpot = cloudSpot;
            saveLocalBackup(cloudSpot);
            updateHeroFromSpot(cloudSpot);
          }
        }
      } catch (error) {
        console.error(error);
      } finally {
        setBusy(false);
      }
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          await navigator.serviceWorker.register("./sw.js");
        } catch (error) {
          console.error("Service worker registration failed:", error);
        }
      });
    }

    init();
  </script>
</body>
