<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>ParkNous</title>
  <!-- UI v4: true annular radial sectors + searching logo animation -->

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <meta name="theme-color" content="#17191e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ParkNous" />

  <style>
    :root {
      --bg: #17191e;
      --bg-deep: #101216;
      --panel: #1d2026;
      --panel-2: #23262d;
      --line: rgba(255,255,255,.16);
      --line-soft: rgba(255,255,255,.08);
      --text: #f4f5f7;
      --muted: #a9aeb8;
      --cyan: #35c9d8;
      --red: #ff5147;
      --orange: #f2a33c;
      --shadow: 0 14px 28px rgba(0,0,0,.32);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,.035), transparent 32%),
        radial-gradient(circle at 18% 70%, rgba(255,255,255,.018), transparent 28%),
        linear-gradient(180deg, #1a1c21 0%, #17191e 48%, #121418 100%);
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding:
        max(6px, env(safe-area-inset-top))
        8px
        max(6px, env(safe-area-inset-bottom));
    }

    button {
      font: inherit;
    }

    .app {
      width: min(100%, 470px);
      height: 100%;
      max-height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) minmax(138px, 27vh);
      gap: 7px;
      position: relative;
    }

    .brand {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.4rem, 6vw, 2rem);
      font-weight: 900;
      letter-spacing: -.6px;
      color: #f7f7f7;
      text-shadow: 0 2px 18px rgba(0,0,0,.35);
      user-select: none;
    }

    .brand span {
      color: var(--cyan);
    }


    .control-stage {
      position: relative;
      width: min(100%, 430px);
      height: 100%;
      min-height: 400px;
      margin: 0 auto;
      isolation: isolate;
    }

    /* Single geometric radial controller.
       All four actions share the exact same centre and radii. */
    .radial-controller {
      position: absolute;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 12px 15px rgba(0,0,0,.34));
    }

    .radial-action {
      cursor: pointer;
      outline: none;
      transition: opacity .16s ease;
    }

    .radial-action.disabled {
      opacity: .42;
      pointer-events: none;
    }

    .radial-segment {
      fill: url(#segmentFill);
      stroke: rgba(255,255,255,.16);
      stroke-width: 1.5;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      transition: fill .12s ease, stroke .12s ease, filter .12s ease;
    }

    .radial-action:hover .radial-segment,
    .radial-action:focus-visible .radial-segment {
      stroke: rgba(53,201,216,.48);
    }

    .radial-action:active .radial-segment {
      fill: #262a31;
      stroke: rgba(53,201,216,.58);
      filter: brightness(1.08);
    }

    .radial-inner-line {
      fill: none;
      stroke: rgba(0,0,0,.54);
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
      opacity: .9;
      pointer-events: none;
    }

    .radial-highlight {
      fill: none;
      stroke: rgba(255,255,255,.055);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .radial-icon,
    .radial-label {
      pointer-events: none;
    }

    .radial-icon {
      fill: none;
      stroke: #f5f6f8;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.28));
    }

    .radial-action.save .radial-icon,
    .radial-action.share .radial-icon {
      stroke: var(--cyan);
    }

    .radial-label {
      fill: #f5f6f8;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
      letter-spacing: .15px;
    }

    .center-spot {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 47.7%;
      transform: translate(-50%, -50%);
      width: 45%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.14);
      background:
        radial-gradient(circle at 48% 30%, rgba(255,255,255,.045), transparent 42%),
        linear-gradient(180deg, #202329, #191c21 82%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 19px;
      text-align: center;
      overflow: hidden;
      box-shadow:
        0 0 0 10px rgba(26,29,34,.98),
        0 0 0 11px rgba(255,255,255,.13),
        0 15px 32px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.045);
    }

    .center-spot::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.13);
      pointer-events: none;
    }

    .center-spot.searching {
      box-shadow:
        0 0 0 10px rgba(26,29,34,.98),
        0 0 0 11px rgba(53,201,216,.28),
        0 15px 32px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.045);
    }

    .center-spot.searching::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 2px solid rgba(53,201,216,.42);
      animation: searchRing 1.55s ease-out infinite;
      pointer-events: none;
    }

    @keyframes searchRing {
      0% { transform: scale(.82); opacity: .82; }
      100% { transform: scale(1.11); opacity: 0; }
    }

    /* Old ParkNous-style searching logo: spins only while GPS is searching,
       breathes, and continuously shifts colour. */
    .search-logo-wrap {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 36%;
      width: 34%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .search-logo-wrap::before,
    .search-logo-wrap::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(53,201,216,.28);
      opacity: 0;
    }

    .search-logo-wrap::before { inset: -13%; }
    .search-logo-wrap::after { inset: -28%; }

    .search-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: center;
      filter: saturate(1.35) drop-shadow(0 0 9px rgba(53,201,216,.35));
    }

    .center-spot.searching .search-logo-wrap { opacity: 1; }

    .center-spot.searching .search-logo {
      animation:
        parkNousLogoSpin 1.85s cubic-bezier(.46,.03,.52,.96) infinite,
        parkNousLogoColor 3.6s linear infinite,
        parkNousLogoBreathe 1.15s ease-in-out infinite alternate;
    }

    .center-spot.searching .search-logo-wrap::before {
      animation: logoEcho 1.55s ease-out infinite;
    }

    .center-spot.searching .search-logo-wrap::after {
      animation: logoEcho 1.55s ease-out .72s infinite;
    }

    @keyframes parkNousLogoSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes parkNousLogoColor {
      0% { filter: hue-rotate(0deg) saturate(1.4) drop-shadow(0 0 8px rgba(53,201,216,.30)); }
      33% { filter: hue-rotate(105deg) saturate(1.65) drop-shadow(0 0 12px rgba(255,195,65,.38)); }
      66% { filter: hue-rotate(220deg) saturate(1.7) drop-shadow(0 0 12px rgba(146,92,255,.40)); }
      100% { filter: hue-rotate(360deg) saturate(1.4) drop-shadow(0 0 8px rgba(53,201,216,.30)); }
    }

    @keyframes parkNousLogoBreathe {
      from { scale: .90; }
      to { scale: 1.06; }
    }

    @keyframes logoEcho {
      0% { transform: scale(.55); opacity: .65; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    .spot-copy {
      position: relative;
      z-index: 3;
      width: 100%;
      transition: transform .2s ease;
    }

    .center-spot.searching .spot-copy {
      transform: translateY(31%);
    }

    .center-spot.searching .spot-kicker,
    .center-spot.searching .spot-time {
      display: none;
    }

    .spot-kicker {
      color: var(--cyan);
      font-size: clamp(.68rem, 2.7vw, .8rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .spot-state {
      font-size: clamp(.96rem, 4vw, 1.18rem);
      line-height: 1.08;
      font-weight: 850;
      margin-bottom: 7px;
    }

    .center-spot.searching .spot-state {
      color: var(--cyan);
      font-size: clamp(.79rem, 3.35vw, .96rem);
      margin-bottom: 3px;
    }

    .spot-time {
      font-size: clamp(.72rem, 2.9vw, .86rem);
      color: #eef0f4;
      line-height: 1.3;
    }

    .spot-accuracy {
      margin-top: 4px;
      font-size: clamp(.68rem, 2.7vw, .8rem);
      color: var(--muted);
    }

    .center-spot.searching .spot-accuracy {
      font-size: clamp(.62rem, 2.45vw, .74rem);
    }

    .delete-btn {
      position: absolute;
      z-index: 6;
      width: 18%;
      min-width: 70px;
      max-width: 82px;
      aspect-ratio: 1;
      left: 50%;
      bottom: 1.7%;
      transform: translateX(-50%);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.14);
      color: var(--red);
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.04), transparent 45%),
        linear-gradient(180deg, #22252b, #191c21);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 10px 22px rgba(0,0,0,.34);
      appearance: none;
      cursor: pointer;
      padding: 8px;
      display: grid;
      place-items: center;
    }

    .delete-btn:active { transform: translateX(-50%) scale(.98); }
    .delete-btn:disabled { opacity: .42; cursor: default; }

    .delete-inner {
      position: relative;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 1px;
    }

    .delete-btn svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.15;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .delete-label {
      font-size: .66rem;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .status-strip {
      position: absolute;
      z-index: 8;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 110%);
      width: min(92%, 390px);
      padding: 9px 11px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(22,24,29,.97);
      box-shadow: 0 12px 26px rgba(0,0,0,.42);
      display: none;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 7px;
      font-size: .74rem;
    }

    .status-strip.show {
      display: grid;
    }

    .status-strip button {
      border: 0;
      border-radius: 9px;
      padding: 8px 9px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: #454950;
    }

    .status-strip button.primary {
      background: #2f94a1;
    }

    .status-strip button.danger {
      background: #b43f39;
    }

    .spots-panel {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.018), rgba(0,0,0,.025)),
        rgba(22,24,29,.72);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
    }

    .spot-column {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .spot-column + .spot-column {
      border-left: 1px solid var(--line);
    }

    .list-head {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px 12px 9px;
      font-weight: 750;
      font-size: clamp(.72rem, 3.1vw, .88rem);
      white-space: nowrap;
    }

    .list-head svg {
      width: 23px;
      height: 23px;
      stroke: var(--cyan);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .spot-list {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      padding: 0 8px 8px;
    }

    .list-empty {
      color: #747a84;
      font-size: .7rem;
      text-align: center;
      padding: 16px 5px;
    }

    .spot-card {
      width: 100%;
      border: 1px solid rgba(255,255,255,.075);
      border-radius: 11px;
      background: rgba(255,255,255,.028);
      color: #f4f5f7;
      padding: 8px 9px;
      margin: 0 0 6px;
      text-align: left;
      cursor: pointer;
    }

    .spot-card.active {
      border-color: rgba(53,201,216,.48);
      background: rgba(53,201,216,.075);
    }

    .spot-card-title {
      font-size: .72rem;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spot-card-meta {
      margin-top: 3px;
      font-size: .62rem;
      line-height: 1.25;
      color: var(--muted);
    }

    .toast {
      position: fixed;
      z-index: 40;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      width: min(calc(100% - 28px), 420px);
      background: rgba(26,29,34,.97);
      color: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px 13px;
      font-size: .78rem;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      box-shadow: 0 14px 30px rgba(0,0,0,.42);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-height: 690px) {
      .app {
        grid-template-rows: 28px minmax(0, 1fr) 145px;
      }
      .brand { font-size: 1.35rem; height: 28px; }
      .control-stage { min-height: 325px; }
      .petal { height: 29%; }
      .center-spot { width: 45%; }
      .spots-panel { border-radius: 18px; }
      .list-head { padding-top: 10px; }
    }

    @media (max-width: 365px) {
      body { padding-left: 5px; padding-right: 5px; }
      .app { gap: 4px; }
      .control-stage { min-height: 335px; }
      .petal { width: 43.5%; }
      .petal-label { font-size: .75rem; }
      .center-spot { width: 45%; }
      .list-head { padding-left: 8px; padding-right: 8px; gap: 6px; }
      .list-head svg { width: 20px; height: 20px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="brand">Park<span>Nous</span></div>

    <section class="control-stage" aria-label="Parking controls">
      <svg class="radial-controller" viewBox="0 0 430 430" aria-label="ParkNous radial controls">
        <defs>
          <linearGradient id="segmentFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#25282f"/>
            <stop offset="44%" stop-color="#202329"/>
            <stop offset="100%" stop-color="#191c21"/>
          </linearGradient>
        </defs>

        <g id="showBtn" class="radial-action show" role="button" tabindex="0" aria-label="Show selected spot on map">
          <path class="radial-segment" d="M 31.82 162.71 A 188 188 0 0 1 172.71 21.82 Q 182.35 19.86 195.55 94.70 Q 189.81 95.87 105.87 179.81 Q 104.70 185.55 29.86 172.35 Q 31.82 162.71 31.82 162.71 Z"/>
          <path class="radial-highlight" d="M79 179 A174 174 0 0 1 116 85"/>
          <path class="radial-inner-line" d="M118 206 A103 103 0 0 1 148 127"/>
          <g class="radial-icon" transform="translate(105 116) scale(1.22)">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </g>
          <text class="radial-label" x="119" y="160">SHOW</text>
        </g>

        <g id="navigateBtn" class="radial-action navigate" role="button" tabindex="0" aria-label="Navigate to selected spot">
          <path class="radial-segment" d="M 257.29 21.82 A 188 188 0 0 1 398.18 162.71 Q 400.14 172.35 325.30 185.55 Q 324.13 179.81 240.19 95.87 Q 234.45 94.70 247.65 19.86 Q 257.29 21.82 257.29 21.82 Z"/>
          <path class="radial-highlight" d="M314 85 A174 174 0 0 1 351 179"/>
          <path class="radial-inner-line" d="M282 127 A103 103 0 0 1 312 206"/>
          <g class="radial-icon" transform="translate(302 114) scale(1.28)">
            <path d="m21 3-8.2 18-2.2-7.6L3 11.2 21 3Z"></path>
          </g>
          <text class="radial-label" x="310" y="160">NAVIGATE</text>
        </g>

        <g id="saveBtn" class="radial-action save" role="button" tabindex="0" aria-label="Save selected spot with a name">
          <path class="radial-segment" d="M 172.71 388.18 A 188 188 0 0 1 31.82 247.29 Q 29.86 237.65 104.70 224.45 Q 105.87 230.19 189.81 314.13 Q 195.55 315.30 182.35 390.14 Q 172.71 388.18 172.71 388.18 Z"/>
          <path class="radial-highlight" d="M83 266 A174 174 0 0 0 119 354"/>
          <path class="radial-inner-line" d="M121 244 A103 103 0 0 0 151 322"/>
          <g class="radial-icon" transform="translate(106 288) scale(1.18)">
            <path d="M5 3h12l2 2v16H5V3Z"></path>
            <path d="M8 3v6h8V3M8 21v-7h8v7"></path>
          </g>
          <text class="radial-label" x="119" y="333">SAVE</text>
        </g>

        <g id="shareBtn" class="radial-action share" role="button" tabindex="0" aria-label="Share selected spot">
          <path class="radial-segment" d="M 398.18 247.29 A 188 188 0 0 1 257.29 388.18 Q 247.65 390.14 234.45 315.30 Q 240.19 314.13 324.13 230.19 Q 325.30 224.45 400.14 237.65 Q 398.18 247.29 398.18 247.29 Z"/>
          <path class="radial-highlight" d="M311 354 A174 174 0 0 0 347 266"/>
          <path class="radial-inner-line" d="M279 322 A103 103 0 0 0 309 244"/>
          <g class="radial-icon" transform="translate(299 288) scale(1.18)">
            <circle cx="18" cy="5" r="2.5"></circle>
            <circle cx="6" cy="12" r="2.5"></circle>
            <circle cx="18" cy="19" r="2.5"></circle>
            <path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"></path>
          </g>
          <text class="radial-label" x="310" y="333">SHARE</text>
        </g>
      </svg>

      <div id="centerSpot" class="center-spot waiting" role="status" aria-live="polite">
        <div class="search-logo-wrap" aria-hidden="true">
          <img class="search-logo" src="favicon.png" alt="" />
        </div>
        <div class="spot-copy">
          <div id="spotKicker" class="spot-kicker">CURRENT SPOT</div>
          <div id="spotState" class="spot-state">STARTING</div>
          <div id="spotTime" class="spot-time"></div>
          <div id="spotAccuracy" class="spot-accuracy"></div>
        </div>
      </div>

      <button id="deleteBtn" class="delete-btn" aria-label="Delete selected spot">
        <span class="delete-inner">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"></path>
          </svg>
          <span class="delete-label">DELETE</span>
        </span>
      </button>

      <div id="accuracyActions" class="status-strip">
        <span id="accuracyMessage">Accuracy is above 30 m.</span>
        <button id="cancelAccuracyBtn">Cancel</button>
        <button id="saveAnywayBtn" class="primary">Save anyway</button>
      </div>

      <div id="deleteConfirm" class="status-strip">
        <span id="deleteMessage">Delete this spot?</span>
        <button id="cancelDeleteBtn">Cancel</button>
        <button id="confirmDeleteBtn" class="danger">Delete</button>
      </div>
    </section>

    <section class="spots-panel" aria-label="Saved and recent spots">
      <div class="spot-column">
        <div class="list-head">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3h12v18l-6-4-6 4V3Z"></path>
          </svg>
          <span>SAVED SPOTS</span>
        </div>
        <div id="savedList" class="spot-list"></div>
      </div>

      <div class="spot-column">
        <div class="list-head">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3 2"></path>
          </svg>
          <span>RECENT SPOTS</span>
        </div>
        <div id="recentList" class="spot-list"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <!--
    GPS PRIORITY:
    This plain script starts geolocation BEFORE the Firebase module imports are downloaded.
    The CSS UI above has no background image, so there is no competing background-image request.
  -->
  <script>
    (() => {
      const MAX_ACCEPTABLE_ACCURACY_METERS = 30;
      const LIVE_SEARCH_TIMEOUT_MS = 22000;
      const CACHED_FALLBACK_MAX_AGE_MS = 10 * 60 * 1000;
      const SESSION_SAVE_KEY = "parkingSavedThisSession";

      function setEarlySearching(text, accuracy) {
        const center = document.getElementById("centerSpot");
        const state = document.getElementById("spotState");
        const acc = document.getElementById("spotAccuracy");
        if (center) center.className = "center-spot searching";
        if (state) state.textContent = text || "SEARCHING";
        if (acc) acc.textContent = accuracy ? `Best accuracy ±${Math.round(accuracy)} m` : "Waiting for GPS...";
      }

      function getCachedFallbackLocation() {
        return new Promise((resolve) => {
          if (!navigator.geolocation) return resolve(null);
          navigator.geolocation.getCurrentPosition(
            resolve,
            () => resolve(null),
            {
              enableHighAccuracy: false,
              timeout: 4000,
              maximumAge: CACHED_FALLBACK_MAX_AGE_MS
            }
          );
        });
      }

      window.ParkNousLocate = function ParkNousLocate(onUpdate) {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error("Geolocation is not supported on this device/browser."));
            return;
          }

          let bestPosition = null;
          let watchId = null;
          let finished = false;

          const update = (label) => {
            if (typeof onUpdate === "function") {
              onUpdate(label, bestPosition);
            }
          };

          const finishSuccess = (payload) => {
            if (finished) return;
            finished = true;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            clearTimeout(timeoutId);
            resolve(payload);
          };

          const finishFailure = (error) => {
            if (finished) return;
            finished = true;
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            clearTimeout(timeoutId);
            reject(error);
          };

          const consider = (position) => {
            const a = position && position.coords && position.coords.accuracy;
            if (typeof a !== "number") return;
            if (!bestPosition || a < bestPosition.coords.accuracy) {
              bestPosition = position;
            }
          };

          const timeoutId = setTimeout(async () => {
            if (finished) return;

            const cached = await getCachedFallbackLocation();
            if (cached) consider(cached);

            if (bestPosition) {
              finishSuccess({
                position: bestPosition,
                accepted: bestPosition.coords.accuracy <= MAX_ACCEPTABLE_ACCURACY_METERS,
                source: "best-after-timeout"
              });
            } else {
              finishFailure(new Error("Could not get a usable location."));
            }
          }, LIVE_SEARCH_TIMEOUT_MS);

          update("SEARCHING...");

          watchId = navigator.geolocation.watchPosition(
            (position) => {
              consider(position);
              update("SEARCHING...");

              const accuracy = position.coords.accuracy;
              if (typeof accuracy === "number" && accuracy <= MAX_ACCEPTABLE_ACCURACY_METERS) {
                finishSuccess({
                  position,
                  accepted: true,
                  source: "live-watch"
                });
              }
            },
            async (error) => {
              const cached = await getCachedFallbackLocation();
              if (cached) {
                consider(cached);
                finishSuccess({
                  position: bestPosition,
                  accepted: bestPosition.coords.accuracy <= MAX_ACCEPTABLE_ACCURACY_METERS,
                  source: "cached-fallback"
                });
                return;
              }

              if (bestPosition) {
                finishSuccess({
                  position: bestPosition,
                  accepted: bestPosition.coords.accuracy <= MAX_ACCEPTABLE_ACCURACY_METERS,
                  source: "best-live"
                });
                return;
              }

              finishFailure(error);
            },
            {
              enableHighAccuracy: true,
              maximumAge: 0,
              timeout: 10000
            }
          );
        });
      };

      const params = new URLSearchParams(location.search);
      const nfcSaveMode = params.get("mode") === "save";
      const alreadySavedThisSession = sessionStorage.getItem(SESSION_SAVE_KEY);

      if (nfcSaveMode && !alreadySavedThisSession) {
        setEarlySearching("SEARCHING...");
        window.__parkNousEarlyLocationPromise = window.ParkNousLocate((label, best) => {
          setEarlySearching("SEARCHING...", best && best.coords ? best.coords.accuracy : null);
        });
      } else {
        window.__parkNousEarlyLocationPromise = null;
      }
    })();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import {
      initializeFirestore,
      persistentLocalCache,
      persistentSingleTabManager,
      doc,
      setDoc,
      getDoc,
      deleteDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBJOuWflHjO3_b-VTerQrhrleIVBz50GGg",
      authDomain: "mini-cooper-routine.firebaseapp.com",
      projectId: "mini-cooper-routine",
      storageBucket: "mini-cooper-routine.firebasestorage.app",
      messagingSenderId: "734879685589",
      appId: "1:734879685589:web:a9a7f1b776efce00e43b5c",
      measurementId: "G-1LETT1WZQ6"
    };

    const LOCAL_KEY = "saveParkingSpotLocalBackupV6";
    const RECENTS_KEY = "parknousRecentSpotsV1";
    const SAVED_KEY = "parknousSavedSpotsV1";
    const SESSION_SAVE_KEY = "parkingSavedThisSession";
    const MAX_RECENT_SPOTS = 5;
    const MAX_ACCEPTABLE_ACCURACY_METERS = 30;

    const params = new URLSearchParams(window.location.search);
    const currentMode = params.get("mode") === "save" ? "save" : "view";

    const centerSpot = document.getElementById("centerSpot");
    const spotKicker = document.getElementById("spotKicker");
    const spotState = document.getElementById("spotState");
    const spotTime = document.getElementById("spotTime");
    const spotAccuracy = document.getElementById("spotAccuracy");

    const showBtn = document.getElementById("showBtn");
    const navigateBtn = document.getElementById("navigateBtn");
    const saveBtn = document.getElementById("saveBtn");
    const shareBtn = document.getElementById("shareBtn");
    const deleteBtn = document.getElementById("deleteBtn");

    const savedList = document.getElementById("savedList");
    const recentList = document.getElementById("recentList");

    const accuracyActions = document.getElementById("accuracyActions");
    const accuracyMessage = document.getElementById("accuracyMessage");
    const cancelAccuracyBtn = document.getElementById("cancelAccuracyBtn");
    const saveAnywayBtn = document.getElementById("saveAnywayBtn");

    const deleteConfirm = document.getElementById("deleteConfirm");
    const deleteMessage = document.getElementById("deleteMessage");
    const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
    const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

    const toastEl = document.getElementById("toast");

    let currentUser = null;
    let lastKnownSpot = null;
    let selectedSpot = null;
    let selectedSource = "current";
    let bestFailedSpot = null;
    let recentSpots = [];
    let savedSpots = [];
    let busy = false;
    let toastTimer = null;

    const firebaseApp = initializeApp(firebaseConfig);

    let db;
    try {
      db = initializeFirestore(firebaseApp, {
        localCache: persistentLocalCache({
          tabManager: persistentSingleTabManager()
        })
      });
    } catch (error) {
      console.warn("Persistent Firestore cache unavailable; using memory cache.", error);
      db = initializeFirestore(firebaseApp);
    }

    const auth = getAuth(firebaseApp);

    function toast(message) {
      clearTimeout(toastTimer);
      toastEl.textContent = message;
      toastEl.classList.add("show");
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function formatDate(ms) {
      if (!ms) return "";
      const d = new Date(ms);
      return d.toLocaleDateString("en-GB", { day: "2-digit", month: "2-digit", year: "2-digit" });
    }

    function formatTime(ms) {
      if (!ms) return "";
      const d = new Date(ms);
      return d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    }

    function spotLabel(spot) {
      if (!spot || !spot.savedAtMillis) return "Parking spot";
      return `${formatDate(spot.savedAtMillis)} ${formatTime(spot.savedAtMillis)}`;
    }

    function setActionDisabled(el, disabled) {
      if (!el) return;
      el.classList.toggle("disabled", !!disabled);
      el.setAttribute("aria-disabled", disabled ? "true" : "false");
      el.tabIndex = disabled ? -1 : 0;
    }

    function setBusy(value) {
      busy = value;
      setActionDisabled(saveBtn, value || !selectedSpot);
      setActionDisabled(showBtn, value || !selectedSpot);
      setActionDisabled(navigateBtn, value || !selectedSpot);
      setActionDisabled(shareBtn, value || !selectedSpot);
      deleteBtn.disabled = value || !selectedSpot;
    }

    function setCenterState(type, kicker, state, spot = null, extra = "") {
      centerSpot.className = `center-spot ${type}`;
      spotKicker.textContent = kicker || "CURRENT SPOT";
      spotState.textContent = state || "";

      if (spot) {
        spotTime.textContent = `${formatDate(spot.savedAtMillis)}  ${formatTime(spot.savedAtMillis)}`;
        const accuracy = typeof spot.accuracy === "number" ? `Accuracy ±${Math.round(spot.accuracy)} m` : "";
        spotAccuracy.textContent = extra || accuracy;
      } else {
        spotTime.textContent = "";
        spotAccuracy.textContent = extra || "";
      }
    }

    function updateSelectedSpot(spot, source = "current") {
      selectedSpot = spot || null;
      selectedSource = source;

      if (!spot) {
        setCenterState("waiting", "CURRENT SPOT", "NO SPOT SAVED");
      } else if (source === "recent") {
        setCenterState("saved", "RECENT SPOT", "SELECTED", spot);
      } else if (source === "saved") {
        setCenterState("saved", "SAVED SPOT", spot.name || "SELECTED", spot);
      } else {
        setCenterState("saved", "CURRENT SPOT", "SAVED", spot);
      }

      setBusy(busy);
      renderLists();
    }

    function saveLocalBackup(spot) {
      try {
        if (spot) localStorage.setItem(LOCAL_KEY, JSON.stringify(spot));
        else localStorage.removeItem(LOCAL_KEY);
      } catch (error) {
        console.error("Local current spot storage failed:", error);
      }
    }

    function readLocalBackup() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        console.error("Local current spot read failed:", error);
        return null;
      }
    }

    function normalizeSavedSpots(items) {
      const clean = Array.isArray(items)
        ? items.filter(x =>
            x &&
            typeof x.name === "string" &&
            x.name.trim() &&
            Number.isFinite(Number(x.lat)) &&
            Number.isFinite(Number(x.lng))
          )
        : [];

      return clean.map(x => ({ ...x, name: x.name.trim() }));
    }

    function readSavedSpots() {
      try {
        const raw = localStorage.getItem(SAVED_KEY);
        return normalizeSavedSpots(raw ? JSON.parse(raw) : []);
      } catch (error) {
        console.error("Saved spots read failed:", error);
        return [];
      }
    }

    function writeSavedSpots(items) {
      savedSpots = normalizeSavedSpots(items);
      try {
        localStorage.setItem(SAVED_KEY, JSON.stringify(savedSpots));
      } catch (error) {
        console.error("Saved spots storage failed:", error);
      }
      renderLists();
    }

    function saveSelectedSpot() {
      if (!selectedSpot) {
        toast("Select a spot first");
        return;
      }

      const defaultName = selectedSpot.name || "";
      const entered = window.prompt("Name this parking spot:", defaultName);
      if (entered === null) return;

      const name = entered.trim();
      if (!name) {
        toast("Please enter a name");
        return;
      }

      const saved = {
        ...selectedSpot,
        name,
        savedListId: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`
      };

      writeSavedSpots([saved, ...savedSpots]);
      updateSelectedSpot(saved, "saved");
      toast(`Saved as ${name}`);
    }

    function normalizeRecents(items) {
      const clean = Array.isArray(items)
        ? items.filter(x =>
            x &&
            Number.isFinite(Number(x.lat)) &&
            Number.isFinite(Number(x.lng)) &&
            Number.isFinite(Number(x.savedAtMillis))
          )
        : [];

      clean.sort((a, b) => Number(b.savedAtMillis) - Number(a.savedAtMillis));
      return clean.slice(0, MAX_RECENT_SPOTS);
    }

    function readRecentSpots() {
      try {
        const raw = localStorage.getItem(RECENTS_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        const trimmed = normalizeRecents(parsed);

        // Important: old installations that somehow contain more than 5 are trimmed immediately.
        localStorage.setItem(RECENTS_KEY, JSON.stringify(trimmed));
        return trimmed;
      } catch (error) {
        console.error("Recent spots read failed:", error);
        return [];
      }
    }

    function writeRecentSpots(items) {
      recentSpots = normalizeRecents(items);
      try {
        localStorage.setItem(RECENTS_KEY, JSON.stringify(recentSpots));
      } catch (error) {
        console.error("Recent spots storage failed:", error);
      }
      renderLists();
    }

    function addRecentSpot(spot) {
      const next = [
        { ...spot, recentId: `${spot.savedAtMillis}-${spot.lat}-${spot.lng}` },
        ...recentSpots
      ];

      // Remove exact duplicate records while preserving newest first.
      const seen = new Set();
      const unique = next.filter(item => {
        const key = item.recentId || `${item.savedAtMillis}-${item.lat}-${item.lng}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      writeRecentSpots(unique.slice(0, MAX_RECENT_SPOTS));
    }

    function renderSpotCard(spot, source, index = 0) {
      const button = document.createElement("button");
      button.className = "spot-card";

      const selected =
        selectedSpot &&
        Number(selectedSpot.savedAtMillis) === Number(spot.savedAtMillis) &&
        Number(selectedSpot.lat) === Number(spot.lat) &&
        Number(selectedSpot.lng) === Number(spot.lng) &&
        (source !== "saved" || selectedSpot.savedListId === spot.savedListId);

      if (selected) button.classList.add("active");

      const title = document.createElement("div");
      title.className = "spot-card-title";
      title.textContent = source === "saved" ? spot.name : spotLabel(spot);

      const meta = document.createElement("div");
      meta.className = "spot-card-meta";
      meta.textContent =
        `${formatTime(spot.savedAtMillis)} • ${typeof spot.accuracy === "number" ? `±${Math.round(spot.accuracy)} m` : "accuracy unknown"}`;

      button.append(title, meta);
      button.addEventListener("click", () => updateSelectedSpot(spot, source));
      return button;
    }

    function renderLists() {
      savedList.replaceChildren();
      recentList.replaceChildren();

      if (savedSpots.length) {
        savedSpots.forEach((spot, index) => savedList.append(renderSpotCard(spot, "saved", index)));
      } else {
        const empty = document.createElement("div");
        empty.className = "list-empty";
        empty.textContent = "Select a spot and tap SAVE";
        savedList.append(empty);
      }

      if (recentSpots.length) {
        recentSpots.forEach((spot, index) => recentList.append(renderSpotCard(spot, "recent", index)));
      } else {
        const empty = document.createElement("div");
        empty.className = "list-empty";
        empty.textContent = "No recent spots";
        recentList.append(empty);
      }
    }

    function clearSaveModeFromUrl() {
      const cleanUrl = window.location.pathname + window.location.hash;
      window.history.replaceState({}, document.title, cleanUrl);
    }

    function getParkingDocRef(uid) {
      return doc(db, "users", uid, "parking", "current");
    }

    async function ensureAnonymousLogin() {
      return new Promise((resolve, reject) => {
        const unsubscribe = onAuthStateChanged(auth, async (user) => {
          if (user) {
            currentUser = user;
            unsubscribe();
            resolve(user);
            return;
          }

          try {
            const result = await signInAnonymously(auth);
            currentUser = result.user;
            unsubscribe();
            resolve(result.user);
          } catch (error) {
            unsubscribe();
            reject(error);
          }
        });
      });
    }

    async function loadCloudSpot() {
      if (!currentUser) return null;

      try {
        const snap = await getDoc(getParkingDocRef(currentUser.uid));
        if (!snap.exists()) return null;

        const data = snap.data();
        return {
          lat: Number(data.lat),
          lng: Number(data.lng),
          accuracy: data.accuracy ?? null,
          savedAtMillis: Number(data.savedAtMillis) || null
        };
      } catch (error) {
        console.error("Cloud read failed:", error);
        return null;
      }
    }

    async function syncCloudSpot(spot) {
      if (!currentUser || !spot) return false;

      try {
        await setDoc(getParkingDocRef(currentUser.uid), {
          ...spot,
          savedAt: serverTimestamp()
        });
        return true;
      } catch (error) {
        console.error("Cloud sync failed:", error);
        return false;
      }
    }

    function buildShowMapUrl(spot) {
      return `https://www.google.com/maps/search/?api=1&query=${spot.lat},${spot.lng}`;
    }

    function buildNavigateMapUrl(spot) {
      return `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}&travelmode=walking&dir_action=navigate`;
    }

    function updateSearchingUi(label, bestPosition) {
      const bestAccuracy =
        bestPosition && bestPosition.coords && typeof bestPosition.coords.accuracy === "number"
          ? `Best accuracy ±${Math.round(bestPosition.coords.accuracy)} m`
          : "Waiting for GPS...";

      setCenterState("searching", "CURRENT SPOT", label || "SEARCHING...", null, bestAccuracy);
    }

    function makeSpotFromResult(result) {
      const p = result.position;
      return {
        lat: p.coords.latitude,
        lng: p.coords.longitude,
        accuracy: p.coords.accuracy,
        savedAtMillis: Date.now()
      };
    }

    function hideAccuracyActions() {
      accuracyActions.classList.remove("show");
      bestFailedSpot = null;
    }

    function showAccuracyActions(spot) {
      bestFailedSpot = spot;
      accuracyMessage.textContent =
        `Best accuracy ±${Math.round(spot.accuracy || 0)} m. Save anyway?`;
      accuracyActions.classList.add("show");
      deleteConfirm.classList.remove("show");
    }

    async function persistAcceptedSpot(spot, authPromise = null) {
      saveLocalBackup(spot);
      addRecentSpot(spot);
      lastKnownSpot = spot;
      updateSelectedSpot(spot, "current");
      toast("Parking spot saved");

      // Cloud is deliberately secondary. The local save and UI happen first.
      try {
        if (!currentUser && authPromise) await authPromise;
        if (currentUser) {
          const synced = await syncCloudSpot(spot);
          if (!synced) toast("Saved locally — cloud sync pending");
        }
      } catch (error) {
        console.error(error);
        toast("Saved locally — cloud unavailable");
      }
    }

    async function runLocationSave(locationPromise = null, authPromise = null) {
      hideAccuracyActions();
      deleteConfirm.classList.remove("show");
      setBusy(true);
      updateSearchingUi("SEARCHING...", null);

      try {
        const result = await (locationPromise || window.ParkNousLocate(updateSearchingUi));
        const spot = makeSpotFromResult(result);

        if (!result.accepted) {
          showAccuracyActions(spot);
          setCenterState(
            "waiting",
            "CURRENT SPOT",
            "ACCURACY TOO LOW",
            spot,
            `Best accuracy ±${Math.round(spot.accuracy || 0)} m`
          );
          return false;
        }

        await persistAcceptedSpot(spot, authPromise);
        return true;
      } catch (error) {
        console.error("Location failed:", error);

        let message = "LOCATION UNAVAILABLE";
        if (error && error.code === 1) message = "PERMISSION DENIED";
        else if (error && error.code === 3) message = "GPS TIMEOUT";

        setCenterState("waiting", "CURRENT SPOT", message, null, "Reopen the NFC save link to try again");
        toast("Could not save location");
        return false;
      } finally {
        setBusy(false);
      }
    }

    function showSelectedLocation() {
      if (showBtn.getAttribute("aria-disabled") === "true" || !selectedSpot) return;
      window.location.href = buildShowMapUrl(selectedSpot);
    }

    function navigateToSelectedLocation() {
      if (navigateBtn.getAttribute("aria-disabled") === "true" || !selectedSpot) return;
      window.location.href = buildNavigateMapUrl(selectedSpot);
    }

    async function shareSelectedLocation() {
      if (shareBtn.getAttribute("aria-disabled") === "true" || !selectedSpot) return;

      const url = buildShowMapUrl(selectedSpot);
      const shareData = {
        title: "ParkNous parking spot",
        text: "My saved parking spot",
        url
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(url);
          toast("Map link copied");
        } else {
          window.location.href = url;
        }
      } catch (error) {
        if (error && error.name !== "AbortError") {
          console.error(error);
          toast("Could not share spot");
        }
      }
    }

    function askDeleteSelected() {
      if (!selectedSpot) return;

      deleteConfirm.classList.add("show");
      accuracyActions.classList.remove("show");

      deleteMessage.textContent =
        selectedSource === "recent"
          ? "Delete this recent spot?"
          : selectedSource === "saved"
            ? `Delete ${selectedSpot.name || "this saved spot"}?`
            : "Clear the current parking spot?";
    }

    async function deleteSelected() {
      if (!selectedSpot) return;

      deleteConfirm.classList.remove("show");

      if (selectedSource === "recent") {
        const target = selectedSpot;
        writeRecentSpots(
          recentSpots.filter(spot =>
            !(
              Number(spot.savedAtMillis) === Number(target.savedAtMillis) &&
              Number(spot.lat) === Number(target.lat) &&
              Number(spot.lng) === Number(target.lng)
            )
          )
        );

        if (lastKnownSpot) updateSelectedSpot(lastKnownSpot, "current");
        else updateSelectedSpot(null);
        toast("Recent spot deleted");
        return;
      }

      if (selectedSource === "saved") {
        const id = selectedSpot.savedListId;
        const name = selectedSpot.name || "Saved spot";
        writeSavedSpots(savedSpots.filter(spot => spot.savedListId !== id));
        if (lastKnownSpot) updateSelectedSpot(lastKnownSpot, "current");
        else updateSelectedSpot(null);
        toast(`${name} deleted`);
        return;
      }

      setBusy(true);
      try {
        saveLocalBackup(null);
        lastKnownSpot = null;
        selectedSpot = null;
        sessionStorage.removeItem(SESSION_SAVE_KEY);

        if (currentUser) {
          try {
            await deleteDoc(getParkingDocRef(currentUser.uid));
          } catch (error) {
            console.error("Cloud delete failed:", error);
            toast("Cleared locally — cloud delete failed");
          }
        }

        updateSelectedSpot(null);
        toast("Current spot cleared");
      } finally {
        setBusy(false);
      }
    }

    showBtn.addEventListener("click", showSelectedLocation);
    navigateBtn.addEventListener("click", navigateToSelectedLocation);
    saveBtn.addEventListener("click", saveSelectedSpot);
    shareBtn.addEventListener("click", shareSelectedLocation);

    [showBtn, navigateBtn, saveBtn, shareBtn].forEach((el) => {
      el.addEventListener("keydown", (event) => {
        if ((event.key === "Enter" || event.key === " ") && el.getAttribute("aria-disabled") !== "true") {
          event.preventDefault();
          el.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        }
      });
    });
    deleteBtn.addEventListener("click", askDeleteSelected);

    cancelAccuracyBtn.addEventListener("click", () => {
      hideAccuracyActions();
      if (lastKnownSpot) updateSelectedSpot(lastKnownSpot, "current");
      else updateSelectedSpot(null);
    });

    saveAnywayBtn.addEventListener("click", async () => {
      if (!bestFailedSpot) return;
      const spot = bestFailedSpot;
      hideAccuracyActions();
      setBusy(true);
      try {
        await persistAcceptedSpot(spot);
        sessionStorage.setItem(SESSION_SAVE_KEY, "true");
        clearSaveModeFromUrl();
      } finally {
        setBusy(false);
      }
    });

    cancelDeleteBtn.addEventListener("click", () => deleteConfirm.classList.remove("show"));
    confirmDeleteBtn.addEventListener("click", deleteSelected);

    async function init() {
      // Local UI is available immediately; no network needed.
      recentSpots = readRecentSpots(); // always trimmed to 5
      savedSpots = readSavedSpots();
      const localSpot = readLocalBackup();
      lastKnownSpot = localSpot;

      if (localSpot) updateSelectedSpot(localSpot, "current");
      else if (!window.__parkNousEarlyLocationPromise) updateSelectedSpot(null);
      else renderLists();

      // Start authentication in parallel. It does NOT gate the GPS request.
      const authPromise = ensureAnonymousLogin()
        .then(() => true)
        .catch(error => {
          console.error("Cloud auth failed:", error);
          return false;
        });

      if (currentMode === "save") {
        if (sessionStorage.getItem(SESSION_SAVE_KEY)) {
          clearSaveModeFromUrl();
          if (lastKnownSpot) updateSelectedSpot(lastKnownSpot, "current");
          toast("Parking already saved in this session");
        } else {
          const saved = await runLocationSave(window.__parkNousEarlyLocationPromise, authPromise);

          if (saved) {
            sessionStorage.setItem(SESSION_SAVE_KEY, "true");
            clearSaveModeFromUrl();
          }
        }

        return;
      }

      // In view mode, cloud sync is background/secondary.
      const authOk = await authPromise;
      if (!authOk) return;

      const cloudSpot = await loadCloudSpot();
      if (!cloudSpot) return;

      // Keep whichever current spot is newer.
      if (!lastKnownSpot || Number(cloudSpot.savedAtMillis || 0) > Number(lastKnownSpot.savedAtMillis || 0)) {
        lastKnownSpot = cloudSpot;
        saveLocalBackup(cloudSpot);
        updateSelectedSpot(cloudSpot, "current");
      } else if (
        lastKnownSpot &&
        Number(lastKnownSpot.savedAtMillis || 0) > Number(cloudSpot.savedAtMillis || 0)
      ) {
        // Local is newer; try to repair cloud quietly.
        await syncCloudSpot(lastKnownSpot);
      }
    }

    init();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(error => {
          console.error("Service worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
